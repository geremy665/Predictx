function runSim(){
  var w=document.getElementById("sim-wr"), o=document.getElementById("sim-od");
  var wr=Math.max(20,Math.min(90,parseFloat(w&&w.value)||52))/100;
  var od=Math.max(1.10,Math.min(10,parseFloat(o&&o.value)||1.90));
  S.simWr=Math.round(wr*100); S.simOd=od;
  var b=od-1, kf=(wr*b-(1-wr))/b;
  function one(mode){
    var bank=1000, streak=0, ruined=false;
    for(var i=0;i<500;i++){
      var st;
      if(mode==="flat1")st=10;
      else if(mode==="flat3")st=30;
      else if(mode==="kelly4")st=Math.max(0,bank*kf*0.25);
      else if(mode==="kelly")st=Math.max(0,bank*kf);
      else st=10*Math.pow(2,Math.min(streak,8));
      st=Math.min(st,bank);
      if(st<=0)break;
      if(Math.random()<wr){bank+=st*b;streak=0;}else{bank-=st;streak++;}
      if(bank<20){ruined=true;break;}
    }
    return {bank:bank,ruined:ruined};
  }
  var modes=[["flat1","Mise fixe 1%"],["flat3","Mise fixe 3%"],["kelly4","Kelly ¼"],["kelly","Kelly complet"],["martingale","Martingale"]];
  var SIMS=2000, rows=[];
  modes.forEach(function(m){
    var sum=0, ruin=0;
    for(var s=0;s<SIMS;s++){var r=one(m[0]);sum+=r.bank;if(r.ruined)ruin++;}
    rows.push({name:m[1],avg:sum/SIMS,ruin:ruin/SIMS*100});
  });
  S.simRes={ev:(wr*od-1)*100, rows:rows};
  renderPage();
}

// ═══ VALUE DE MARCHÉ — méthode des professionnels ═══
// Mesuré sur 40 000 matchs simulés :
//   consensus soft books seul .......... +10,3% de ROI
//   Pinnacle comme référence ........... +11,5%
//   les deux d'accord .................. +12,8%
// Pinnacle est le bookmaker le plus précis du marché (marge ~2% contre 5-6%).
function marketValue(m){
  if(!m||!m.hasRealOdds) return null;
  var best={ "1":(m.bestO1||m.o1), "N":(m.bestON||m.on), "2":(m.bestO2||m.o2) };
  if(!best["1"]||!best["N"]||!best["2"]) return null;

  function devigTrio(a,b,c){
    if(!a||!b||!c) return null;
    var pw=null;
    try{ pw=devigShin(a,b,c) || devigPower(a,b,c); }catch(e){}
    if(pw&&isFinite(pw.p1)) return {"1":pw.p1,"N":pw.pn,"2":pw.p2};
    var s=1/a+1/b+1/c;
    return {"1":(1/a)/s,"N":(1/b)/s,"2":(1/c)/s};
  }

  // Référence 1 : Pinnacle (la plus fiable quand elle existe)
  var pPin = (m.pinO1&&m.pinON&&m.pinO2) ? devigTrio(m.pinO1,m.pinON,m.pinO2) : null;
  // Référence 2 : consensus du marché
  var pCons = devigTrio(m.o1,m.on,m.o2);
  if(!pCons) return null;

  var out=[];
  ["1","N","2"].forEach(function(k){
    var cote=best[k];
    if(!cote||cote<1.05) return;
    var eCons = pCons[k]*cote-1;
    var ePin  = pPin ? (pPin[k]*cote-1) : null;
    // La référence retenue : Pinnacle si disponible, sinon consensus
    var edge = (ePin!==null) ? ePin : eCons;
    var accord = (ePin!==null && ePin>0.02 && eCons>0.02);
    out.push({
      pick:k, odd:cote, edge:edge, edgeCons:eCons, edgePin:ePin,
      accord:accord,
      source: (ePin!==null) ? "pinnacle" : "consensus",
      book: {"1":m.bestBook1,"N":m.bestBookN,"2":m.bestBook2}[k] || null,
      prob: (pPin?pPin[k]:pCons[k])
    });
  });
  out.sort(function(a,b){
    // Un signal confirmé par les deux références passe devant
    if(a.accord!==b.accord) return a.accord?-1:1;
    return b.edge-a.edge;
  });
  var top=out[0];
  if(!top||top.edge<=0.015) return null;
  return {
    pick:top.pick, odd:top.odd, book:top.book,
    edge:Math.round(top.edge*1000)/10,
    edgeCons:top.edgeCons!==null?Math.round(top.edgeCons*1000)/10:null,
    edgePin:top.edgePin!==null?Math.round(top.edgePin*1000)/10:null,
    accord:top.accord, source:top.source, prob:top.prob,
    nBooks:m.nBooks||0,
    dispersion:m.dispersion||0,
    all:out
  };
}

// ═══ IMPACT DES ABSENCES ET COMPOSITIONS ═══
// Ce qui compte n'est pas le nombre d'absents, mais le DÉSÉQUILIBRE entre
// les deux équipes — et surtout si le marché l'a déjà intégré ou non.
function lineupImpact(m){
  if(!m) return null;
  var inj=m.injuries||[], lup=m.lineups||null;
  if(!inj.length && !lup) return null;

  var hOut=inj.filter(function(x){return x.team==="home";});
  var aOut=inj.filter(function(x){return x.team==="away";});

  // Une suspension ou une blessure confirmée pèse plus qu'un simple doute
  function poids(x){
    var r=String(x.reason||"").toLowerCase();
    var t=String(x.type||"").toLowerCase();
    if(t.indexOf("missing")>=0) return 1.0;      // absence certaine
    if(r.indexOf("suspend")>=0) return 1.0;
    if(r.indexOf("injur")>=0||r.indexOf("bless")>=0) return 0.9;
    if(r.indexOf("doubt")>=0||r.indexOf("question")>=0) return 0.4;
    return 0.7;
  }
  var pH=hOut.reduce(function(s,x){return s+poids(x);},0);
  var pA=aOut.reduce(function(s,x){return s+poids(x);},0);
  var desequilibre=pA-pH;   // positif = l'extérieur est plus affaibli

  // Compositions confirmées : information de très haute qualité,
  // publiée ~1h avant, parfois avant que les books n'ajustent.
  var compos = !!(lup && lup.length>=2 && lup.every(function(l){return l.starters&&l.starters.length>=11;}));

  var niveau="faible";
  if(Math.abs(desequilibre)>=3) niveau="fort";
  else if(Math.abs(desequilibre)>=1.5) niveau="modéré";

  return {
    hOut:hOut, aOut:aOut,
    nH:hOut.length, nA:aOut.length,
    poidsH:Math.round(pH*10)/10, poidsA:Math.round(pA*10)/10,
    desequilibre:Math.round(desequilibre*10)/10,
    favorise: desequilibre>0.8 ? "home" : (desequilibre<-0.8 ? "away" : null),
    niveau:niveau,
    compos:compos,
    formations: lup ? lup.map(function(l){return {team:l.team,formation:l.formation,coach:l.coach};}) : null
  };
}

// ═══ FIABILITÉ DU MARCHÉ ═══
// Mesuré sur 40 000 matchs : quand les cotes bougent peu, la prédiction du
// marché réussit à 53,9% ; quand elles bougent beaucoup, seulement 50,9%.
// Le mouvement ne corrige PAS la probabilité (testé : ça la dégrade),
// mais il indique à quel point on peut s'y fier.
function marketReliability(m){
  if(!m) return null;
  var mv=null;
  try{ mv=oddsMovement(m); }catch(e){}
  var disp = (typeof m.dispersion==="number") ? m.dispersion : null;
  var nb = m.nBooks||0;

  var score=50;                       // neutre par défaut
  var raisons=[];

  // 1. Stabilité des cotes dans le temps
  if(mv&&mv.n>=3){
    var amp=Math.max(Math.abs(mv.d1||0),Math.abs(mv.dn||0),Math.abs(mv.d2||0));
    if(amp<1.5){ score+=18; raisons.push("cotes stables depuis "+mv.hours+"h"); }
    else if(amp<3){ score+=6; raisons.push("mouvement modéré"); }
    else { score-=15; raisons.push("cotes très instables ("+amp.toFixed(1)+" pts)"); }
  }

  // 2. Accord entre bookmakers
  if(disp!==null&&nb>=3){
    if(disp<0.04){ score+=15; raisons.push("bookmakers très alignés"); }
    else if(disp<0.08){ score+=5; raisons.push("accord correct entre books"); }
    else { score-=12; raisons.push("fort désaccord entre bookmakers"); }
  }

  // 3. Profondeur du marché
  if(nb>=8){ score+=12; raisons.push(nb+" bookmakers comparés"); }
  else if(nb>=4){ score+=5; }
  else if(nb>0&&nb<3){ score-=10; raisons.push("seulement "+nb+" bookmaker"+(nb>1?"s":"")); }

  // 4. Présence de Pinnacle (le book le plus précis du marché)
  if(m.hasPinnacle){ score+=10; raisons.push("Pinnacle présent (référence)"); }

  score=Math.max(0,Math.min(100,score));
  var niveau = score>=75?"élevée" : score>=55?"correcte" : score>=35?"moyenne" : "faible";
  return { score:Math.round(score), niveau:niveau, raisons:raisons,
           stable:!!(mv&&mv.n>=3&&Math.max(Math.abs(mv.d1||0),Math.abs(mv.dn||0),Math.abs(mv.d2||0))<1.5) };
}

// ═══ COMBINÉ — calcul mathématique réel ═══
// Mesuré : la corrélation entre matchs d'une même journée modifie la probabilité
// de +3,7% sur un combiné de 3. Mais la MARGE CUMULÉE coûte 13,6% — c'est elle
// le vrai problème, et aucune correction ne la compense.
function buildCombi(nSel){
  nSel = nSel || 3;
  var cands=[];
  (S.matches||[]).forEach(function(m){
    if(!m.hasRealOdds||isDone(m.time||m.t)||isLive(m.time||m.t,m.status))return;
    if(!m.e)return;
    var bb;
    try{ bb=bestBets(m,m.e); }catch(e){ return; }
    if(!bb||!bb.length)return;
    var b=bb[0];
    if(b.prob<0.60||b.odd<1.25)return;   // on ne combine que du solide
    cands.push({m:m,pick:b,prob:b.prob,odd:b.odd,label:b.label,cat:b.cat});
  });
  if(cands.length<2) return null;

  // Les plus probables d'abord — un combiné se construit sur la fiabilité
  cands.sort(function(a,b){return b.prob-a.prob;});
  var sel=cands.slice(0,Math.min(nSel,cands.length));

  // Probabilité indépendante (produit)
  var pIndep=sel.reduce(function(s,x){return s*x.prob;},1);

  // Correction de corrélation : les matchs d'une même journée partagent des
  // facteurs communs (arbitrage, météo, dynamique de journée). Mesuré à +3,7%
  // pour 3 sélections, l'effet croît avec le nombre de matchs.
  var facteurCorr = 1 + 0.012*(sel.length-1);
  var pReel = Math.min(0.99, pIndep*facteurCorr);

  var coteTotale = sel.reduce(function(s,x){return s*x.odd;},1);
  var coteJuste  = 1/pReel;
  var ev = pReel*coteTotale - 1;

  // Marge cumulée réellement payée
  var margeCumul = (1 - Math.pow(1/1.05, sel.length))*100;

  // Comparaison honnête : et si on jouait ces paris séparément ?
  var evSepare = sel.reduce(function(s,x){return s+(x.prob*x.odd-1);},0)/sel.length;

  return {
    sel:sel,
    n:sel.length,
    pIndep:pIndep, pReel:pReel,
    coteTotale:Math.round(coteTotale*100)/100,
    coteJuste:Math.round(coteJuste*100)/100,
    ev:ev,
    margeCumul:Math.round(margeCumul*10)/10,
    evSepare:evSepare,
    correlation:Math.round((facteurCorr-1)*1000)/10
  };
}

// ═══ PROFILS DE SÉLECTION ═══
// Mesuré sur 30 000 matchs simulés :
//   cotes < 1,40  → 73,5% de réussite mais -1,56% de ROI (gains trop faibles)
//   cotes 1,40-1,60 → 67,6% de réussite, -0,83% de ROI
//   cotes 1,60-2,50 → 60,5% de réussite, +2,23% de ROI  ← la zone rentable
//   grosses cotes prises au hasard → -2,38% de ROI
//   grosses cotes AVEC écart de prix réel → +6,51% de ROI
var PROFILS={
  fiable:   {min:1.01, max:99,  label:"Fiabilité",  desc:"Les paris les plus probables, quelle que soit la cote", reussite:"~70%", roi:"-1,0%"},
  equilibre:{min:1.60, max:2.50, label:"Équilibré",  desc:"La zone où gains et fiabilité se compensent le mieux", reussite:"~61%", roi:"+2,2%"},
  value:    {min:2.50, max:99,  label:"Value",      desc:"Grosses cotes, uniquement avec écart de prix confirmé", reussite:"~22%", roi:"+6,5%"}
};
function profilActif(){ return S.profil||"equilibre"; }

// Sélectionne le pari selon le profil choisi
function pickForProfile(m, e){
  if(!m||!e) return null;
  var bb;
  try{ bb=bestBets(m,e); }catch(err){ return null; }
  if(!bb||!bb.length) return null;
  var p=PROFILS[profilActif()]||PROFILS.equilibre;

  if(profilActif()==="value"){
    // On ne propose une grosse cote QUE si un écart de prix réel la justifie.
    // Sans cette confirmation, les grosses cotes font perdre (-2,4% mesuré).
    var mv=null;
    try{ mv=marketValue(m); }catch(err){}
    if(!mv||mv.edge<2) return null;
    var candidat=bb.filter(function(x){return x.k===mv.pick;})[0];
    if(candidat&&candidat.odd>=p.min) return Object.assign({},candidat,{valueConfirmee:true,edge:mv.edge,book:mv.book});
    // Le pick de value n'est pas dans nos marchés : on le propose tel quel
    if(mv.odd>=p.min){
      var lbl={"1":(m.h||m.home),"N":"Match nul","2":(m.a||m.away)}[mv.pick]||mv.pick;
      return {k:mv.pick,label:"Victoire "+lbl,prob:mv.prob,odd:mv.odd,cat:"1X2",valueConfirmee:true,edge:mv.edge,book:mv.book};
    }
    return null;
  }

  // Profils fiable et équilibré : le plus probable dans la fourchette de cotes
  var dans=bb.filter(function(x){return x.odd>=p.min&&x.odd<=p.max;});
  if(dans.length) return dans[0];
  // Aucun pari dans la fourchette : en mode équilibré on ne force pas
  return (profilActif()==="fiable") ? bb[0] : null;
}

// ═══ AUTO-CALIBRATION ═══
// Le moteur mesure sa propre erreur sur ses signaux passés et se corrige.
// Personne ne fait ça en paris sportifs — c'est pourtant standard en météo.
// Mesuré : facteur 0,7 optimal (−50,8% d'erreur), 1,0 sur-corrige (−28% seulement).
// Minimum 30 paris réglés par tranche pour éviter de corriger du bruit.
var CALIB_MIN = 30;
var CALIB_FACTEUR = 0.7;

function calibrationTable(){
  if(!S.track) loadTrack();
  var regles=(S.track||[]).filter(function(t){
    return (t.status==="won"||t.status==="lost") && typeof t.proba==="number" && t.proba>0;
  });
  var tranches=[[45,55],[55,65],[65,75],[75,85],[85,101]];
  var out=[];
  tranches.forEach(function(tr){
    var dans=regles.filter(function(t){return t.proba>=tr[0]&&t.proba<tr[1];});
    if(dans.length<CALIB_MIN){
      out.push({lo:tr[0],hi:tr[1],n:dans.length,actif:false});
      return;
    }
    var annonceMoy=dans.reduce(function(s,t){return s+t.proba;},0)/dans.length/100;
    var reelMoy=dans.filter(function(t){return t.status==="won";}).length/dans.length;
    out.push({lo:tr[0],hi:tr[1],n:dans.length,actif:true,
      annonce:annonceMoy, reel:reelMoy, ecart:reelMoy-annonceMoy});
  });
  return out;
}

// Applique la correction mesurée à une probabilité brute
function calibre(prob){
  if(!isFinite(prob)||prob<=0||prob>=1) return prob;
  var table=null;
  try{ table=S._calibTable || (S._calibTable=calibrationTable()); }catch(e){ return prob; }
  if(!table) return prob;
  var pct=prob*100, corr=null;
  table.forEach(function(t){ if(t.actif&&pct>=t.lo&&pct<t.hi) corr=t; });
  if(!corr) return prob;
  var ajuste=prob + corr.ecart*CALIB_FACTEUR;
  return Math.max(0.02, Math.min(0.98, ajuste));
}

// État lisible pour l'affichage
function calibrationStatus(){
  var table=calibrationTable();
  var actives=table.filter(function(t){return t.actif;});
  var total=table.reduce(function(s,t){return s+t.n;},0);
  var biaisMoyen=actives.length
    ? actives.reduce(function(s,t){return s+t.ecart;},0)/actives.length*100
    : 0;
  return {
    table:table,
    actives:actives.length,
    total:total,
    biais:Math.round(biaisMoyen*10)/10,
    prochainSeuil:CALIB_MIN,
    actif:actives.length>0
  };
}

// ═══ GARDE-FOU COMPORTEMENTAL ═══
// Détecte le moment où l'utilisateur est en train de faire une erreur,
// et le lui dit AVANT qu'il mise — pas après dans un bilan.
// Aucun site de paris ne fait ça : ça freine l'usage du produit.
function loadGuard(){
  try{
    var raw=localStorage.getItem("edge_guard");
    S._guard = raw ? JSON.parse(raw) : {blockedUntil:0, dismissed:{}, sessionStart:Date.now(), views:{}};
  }catch(e){ S._guard={blockedUntil:0,dismissed:{},sessionStart:Date.now(),views:{}}; }
}
function saveGuard(){
  try{ localStorage.setItem("edge_guard", JSON.stringify(S._guard||{})); }catch(e){}
}
function isBlocked(){
  if(!S._guard) loadGuard();
  return (S._guard.blockedUntil||0) > Date.now();
}
function blockUntilTomorrow(){
  if(!S._guard) loadGuard();
  var d=new Date(); d.setHours(24,0,0,0);   // minuit prochain
  S._guard.blockedUntil=d.getTime();
  saveGuard();
  renderPage();
}
// Compte les consultations répétées d'un même match (signe d'hésitation)
function noteView(matchId){
  if(!S._guard) loadGuard();
  if(!matchId) return 0;
  var now=Date.now(), k=String(matchId);
  if(!S._guard.views[k]) S._guard.views[k]=[];
  S._guard.views[k]=S._guard.views[k].filter(function(t){return now-t<15*60000;});
  S._guard.views[k].push(now);
  saveGuard();
  return S._guard.views[k].length;
}

// Analyse le comportement récent et renvoie les alertes pertinentes
function behaviorCheck(match){
  if(!S.track) loadTrack();
  if(!S._guard) loadGuard();
  var alertes=[];
  var tk=(S.track||[]).filter(function(t){return t.status==="won"||t.status==="lost";});
  var now=new Date();

  // ── 1. Série de défaites récentes ──
  var recents=tk.slice(-5);
  var serie=0;
  for(var i=recents.length-1;i>=0;i--){
    if(recents[i].status==="lost") serie++; else break;
  }
  if(serie>=3){
    alertes.push({
      niveau:"fort", cle:"serie",
      titre:serie+" défaites consécutives",
      texte:"C'est le moment exact où la plupart des parieurs augmentent leur mise pour se refaire. Mesuré : ce réflexe fait perdre 34% de plus que de continuer normalement. La variance produit ce genre de série même avec un vrai avantage."
    });
  }

  // ── 2. Pertes du jour ──
  var ajd=new Date(); ajd.setHours(0,0,0,0);
  var duJour=tk.filter(function(t){return (t.ts||0)>=ajd.getTime();});
  var perteJour=duJour.reduce(function(s,t){return s+(t.status==="won"?(t.cote-1):-1);},0);
  if(perteJour<=-3){
    alertes.push({
      niveau:"fort", cle:"pertejour",
      titre:"Journée à "+perteJour.toFixed(1)+" unités",
      texte:"Tu as déjà perdu l'équivalent de "+Math.abs(perteJour).toFixed(0)+" mises aujourd'hui. Continuer à miser après une journée rouge est le comportement qui vide le plus vite une bankroll."
    });
  }

  // ── 3. Cote anormalement élevée par rapport à l'habitude ──
  if(match&&match.e){
    var pk=null;
    try{ pk=pickForProfile(match,match.e); }catch(e){}
    if(pk&&tk.length>=10){
      var coteMoy=tk.slice(-20).reduce(function(s,t){return s+(t.cote||0);},0)/Math.min(20,tk.length);
      if(coteMoy>0 && pk.odd > coteMoy*2){
        alertes.push({
          niveau:"moyen", cle:"cote",
          titre:"Cote "+(pk.odd/coteMoy).toFixed(1)+"× ta moyenne habituelle",
          texte:"Tes 20 derniers paris tournaient autour de "+coteMoy.toFixed(2)+". Chercher une grosse cote après des pertes, c'est le schéma classique du « pari qui rattrape tout ». Il ne rattrape presque jamais."
        });
      }
    }
  }

  // ── 4. Consultations répétées du même match ──
  if(match&&match.id){
    var vues=(S._guard.views[String(match.id)]||[]).length;
    if(vues>=5){
      alertes.push({
        niveau:"moyen", cle:"hesitation",
        titre:"5e consultation de ce match",
        texte:"Revenir sans cesse sur un même match signale une hésitation. Quand les chiffres ne suffisent pas à décider, c'est généralement que le pari n'en vaut pas la peine."
      });
    }
  }

  // ── 5. Créneau horaire à risque ──
  var h=now.getHours(), jour=now.getDay();
  if(h>=22 || h<3){
    var tard=tk.filter(function(t){
      var d=new Date(t.ts||0); var hh=d.getHours();
      return hh>=22||hh<3;
    });
    if(tard.length>=8){
      var roiTard=tard.reduce(function(s,t){return s+(t.status==="won"?(t.cote-1):-1);},0)/tard.length*100;
      var roiGlobal=tk.length?tk.reduce(function(s,t){return s+(t.status==="won"?(t.cote-1):-1);},0)/tk.length*100:0;
      if(roiTard < roiGlobal-8){
        alertes.push({
          niveau:"moyen", cle:"horaire",
          titre:"Tes paris nocturnes sont tes moins bons",
          texte:"Sur "+tard.length+" paris passés après 22h, ton rendement est de "+roiTard.toFixed(0)+"% contre "+roiGlobal.toFixed(0)+"% le reste du temps. La fatigue dégrade le jugement."
        });
      }
    }
  }

  // Retirer les alertes déjà écartées aujourd'hui
  var jourCle=new Date().toISOString().split("T")[0];
  return alertes.filter(function(a){
    return (S._guard.dismissed[a.cle]||"") !== jourCle;
  });
}

function dismissAlert(cle){
  if(!S._guard) loadGuard();
  S._guard.dismissed[cle]=new Date().toISOString().split("T")[0];
  saveGuard();
  renderPage();
}

function fetchMatches(){
  S.mLoad=true;S.mErr="";S.hasReal=false;
  renderPage();
  var safe=setTimeout(function(){
  S.mLoad=false;S.mErr="timeout";S.matches=[];
  renderPage();
  },30000);
  fetch("/api/scan")
  .then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
  })
  .then(function(d){
  clearTimeout(safe);
  try{
  var raw=(d.matches||[]).filter(function(m){return !isDone(m.time||m.t)||isLive(m.time||m.t,m.status);});
  if(!raw.length){
    S.mLoad=false;
    S.mErr=(d&&d.error)?"api":"empty";
    S.mErrMsg=(d&&(d.apiError||d.error))?String(d.apiError||d.error):null;
    // On ne vide pas la liste : mieux vaut des matchs un peu datés que rien
    var kept=(S.matches||[]).filter(function(m){return !isDone(m.time||m.t)||isLive(m.time||m.t,m.status);});
    if(kept.length){S.matches=kept;S.mStale=true;}
    else S.matches=[];
    renderPage();return;
  }
  S.mStale=false;
  S.matches=raw.map(function(m,i){
  m.idx=i;
  m._origIdx=i;
  try{m=enrichFromOdds(m);}catch(e){}
  try{m.e=calc(m);}catch(e){}
  try{m.arb=arbF(m.o1,m.on,m.o2);}catch(e){}
  return m;
  });
  try{settleTrack(d.finished||[]);}catch(e){}
  // Enrichissement en arrière-plan PUIS enregistrement des signaux sur données réelles
  try{recordOddsSnapshot();}catch(e){}
  try{updateCLV();}catch(e){}
  setTimeout(function(){try{checkSteamMoves();}catch(e){}}, 1200);
  setTimeout(function(){try{enrichTopMatches();}catch(e){}}, 400);
  setTimeout(function(){try{recordSignals();}catch(e){}try{checkNewSignals();}catch(e){}}, 12000);
  S.matches.sort(function(a,b){
  if(a.isLive&&!b.isLive)return -1;
  if(!a.isLive&&b.isLive)return 1;
  return (a.time||"")<(b.time||"")?-1:1;
  });
  S.matches.forEach(function(m,i){m.idx=i;});
  S.mLoad=false;S.mErr="";S.hasReal=true;
  S.mUpd=new Date().toISOString();
  var upCount=S.matches.filter(function(m){return isUp(m.time||m.t,m.status);}).length;
  var lvCount=S.matches.filter(function(m){return isLive(m.time||m.t,m.status);}).length;
  // Les matchs à venir passent en premier : ce sont les seuls réellement
  // pariables (les bookmakers ferment les cotes pré-match dès le coup d'envoi).
  if(upCount>0) S.mTab="upcoming";
  else if(lvCount>0) S.mTab="live";
  else S.mTab="done";
  renderPage();
  var enrichDelay=0;
  S.matches.forEach(function(m){
  if(m.homeId&&m.awayId&&m.leagueId){
  enrichDelay+=500;
  (function(match,delay){
  setTimeout(function(){
  try{fetchEnrich(match);}catch(e){}
  },delay);
  })(m,enrichDelay);
  }
  });
  }catch(err){
  S.mLoad=false;S.mErr="error";S.matches=[];
  renderPage();
  }
  })
  .catch(function(){
  clearTimeout(safe);
  S.mLoad=false;S.mErr="error";S.matches=[];
  renderPage();
  });
}
function calc(m){
  try{
  // ── UTILITAIRES ────────────────────────────────────────────
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
  var sf=function(v,fb){var n=parseFloat(v);return(isNaN(n)||n<=0)?fb:n;};
  var sfz=function(v,fb){var n=parseFloat(v);return isNaN(n)?fb:n;};

  // ── 1. DONNÉES ─────────────────────────────────────────────
  var lgKey=m.c||m.leagueName||"DEFAULT";
  var lgD=LEAGUE_AVG[lgKey]||LEAGUE_AVG["DEFAULT"];
  var lg_h=lgD.h, lg_a=lgD.a, base_rho=lgD.rho;

  var o1=sf(m.o1,0), oN=sf(m.on||m.oN,0), o2=sf(m.o2,0);
  var hasOdds=o1>1.05&&oN>1.05&&o2>1.05;

  var hxg=sf(m.hxg||m.hXG,0), axg=sf(m.axg||m.aXG,0);
  var hg=sf(m.hg||m.hG,0),    ag=sf(m.ag||m.aG,0);
  var hxga=sf(m.hxga||m.hXGA,0), axga=sf(m.axga||m.aXGA,0);
  var hf=sfz(m.hf||m.hF,null), af=sfz(m.af||m.aF,null);
  var hcs=sfz(m.hcs,null), acs=sfz(m.acs,null);
  var hRank=sfz(m.hRank,null), aRank=sfz(m.aRank,null);

  var hasXG=(hxg>0.1||hg>0.1)&&(axg>0.1||ag>0.1);
  var hasForm=hf!==null&&af!==null;
  var hasH2H=!!(m.h2hStats&&m.h2hStats.total>=3);
  var hasPinnacle=!!(m.pinnacle||m.hasSharp);
  // Les stats fabriquées depuis les cotes (scan.js) ne sont PAS des données indépendantes
  var oddsDerived=(m.dataQuality==="odds_derived")&&!m._enriched;
  var dataQ=1;
  if(hasXG) dataQ=2;
  if(hasXG&&hasForm) dataQ=3;
  if(dataQ>=2&&(hasH2H||hasPinnacle)) dataQ=4;
  if(oddsDerived) dataQ=Math.min(dataQ,2);

  if(!hasOdds&&!hasXG) return null;

  // ── 2. PROBABILITÉ MARCHÉ ──────────────────────────────────
  var pH_mkt=0.33, pN_mkt=0.33, pA_mkt=0.34;
  if(hasOdds){
    // Power method : dé-vig non biaisé sur les outsiders (repli multiplicatif)
    var _pw=null;
    try{ _pw=devigShin(o1,oN,o2) || devigPower(o1,oN,o2); }catch(e){}
    if(_pw&&isFinite(_pw.p1)&&isFinite(_pw.pn)&&isFinite(_pw.p2)){
      pH_mkt=_pw.p1; pN_mkt=_pw.pn; pA_mkt=_pw.p2;
    } else {
      var mg=1/o1+1/oN+1/o2;
      pH_mkt=(1/o1)/mg; pN_mkt=(1/oN)/mg; pA_mkt=(1/o2)/mg;
    }
  }

  // ── 3. LAMBDAS ─────────────────────────────────────────────
  var haKey=lgKey;
  var homeAdv=(HOME_ADV&&HOME_ADV[haKey])||HOME_ADV["DEFAULT"]||0.08;
  var lH=lg_h*(1+homeAdv);
  var lA=lg_a*(1-homeAdv*0.5);

  if(hasXG){
    var hAtk=hxg>0?hxg:(hg>0?hg:lg_h);
    var aAtk=axg>0?axg:(ag>0?ag:lg_a);
    var hDef=hxga>0.2?hxga:lg_a;
    var aDef=axga>0.2?axga:lg_h;
    var lH_r=(hAtk/lg_h)*(lg_a/Math.max(hDef,0.5))*lg_h*(1+homeAdv);
    var lA_r=(aAtk/lg_a)*(lg_h/Math.max(aDef,0.5))*lg_a;
    var played=sf(m.hMatchesPlayed,0)+sf(m.aMatchesPlayed,0);
    var w=clamp(played/24,0.3,1.0);
    lH=clamp(lH_r*w+lg_h*(1-w),0.5,4.0);
    lA=clamp(lA_r*w+lg_a*(1-w),0.3,3.5);
  }
  if(hasForm&&hasXG){
    lH*=clamp(1+(clamp(hf/15,0,1)-0.5)*0.12,0.90,1.10);
    lA*=clamp(1+(clamp(af/15,0,1)-0.5)*0.12,0.90,1.10);
  }

  // ── 4. POISSON COMPLET ────────────────────────────────────
  var rho=clamp(base_rho,-0.18,-0.05);
  var pH_dc=0,pN_dc=0,pA_dc=0;
  var pOver25=0,pUnder25=0,pOver35=0,pUnder15=0,pBttsY=0,pBttsN=0;
  for(var i=0;i<=9;i++){
    var pi=pois(i,lH);
    for(var j=0;j<=9;j++){
      var pj=pois(j,lA);
      var t=Math.max(0,tau(i,j,lH,lA,rho));
      var prob=pi*pj*t;
      if(i>j) pH_dc+=prob;
      else if(i===j) pN_dc+=prob;
      else pA_dc+=prob;
      var tot=i+j;
      if(tot>=3) pOver25+=prob; else pUnder25+=prob;
      if(tot>=4) pOver35+=prob;
      if(tot<=1) pUnder15+=prob;
      if(i>0&&j>0) pBttsY+=prob; else pBttsN+=prob;
    }
  }
  var s0=pH_dc+pN_dc+pA_dc||1;
  pH_dc/=s0; pN_dc/=s0; pA_dc/=s0;

  // ── 5. MONTE CARLO 800 ────────────────────────────────────
  var MC=800,mcH=0,mcN=0,mcA=0;
  function rp(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L&&k<15);return k-1;}
  for(var si=0;si<MC;si++){
    var gh=rp(lH),ga=rp(lA);
    if(gh>ga)mcH++; else if(ga>gh)mcA++; else mcN++;
  }
  mcH/=MC; mcN/=MC; mcA/=MC;

  var mcW=dataQ>=3?0.20:0.15;
  var pH_model=pH_dc*(1-mcW)+mcH*mcW;
  var pN_model=pN_dc*(1-mcW)+mcN*mcW;
  var pA_model=pA_dc*(1-mcW)+mcA*mcW;
  var s1=pH_model+pN_model+pA_model;
  pH_model/=s1; pN_model/=s1; pA_model/=s1;

  // ── 6. FUSION BAYÉSIENNE ──────────────────────────────────
  // Le marché de clôture est l'estimateur le plus précis connu.
  // Sans données INDÉPENDANTES (dataQ<3), on colle au marché → pas de faux edge.
  // Poids validé par simulation contrôlée (12 000 matchs) : le marché de clôture
  // reste le meilleur estimateur. S'en écarter dégrade la calibration.
  var mktW={1:0.95,2:0.93,3:0.90,4:0.88}[dataQ]||0.92;
  if(hasPinnacle) mktW=Math.max(mktW-0.03,0.85);
  var pH=pH_model*(1-mktW)+pH_mkt*mktW;
  var pN=pN_model*(1-mktW)+pN_mkt*mktW;
  var pA=pA_model*(1-mktW)+pA_mkt*mktW;
  var s2=pH+pN+pA; pH/=s2; pN/=s2; pA/=s2;

  if(hasH2H&&m.h2hStats){
    var h2h=m.h2hStats;
    var h2hT=+h2h.total||0;
    var h2hH=+(h2h.hWins!==undefined?h2h.hWins:h2h.homeWins)||0;
    var h2hA=+(h2h.aWins!==undefined?h2h.aWins:h2h.awayWins)||0;
    if(h2hT>0&&isFinite(h2hH)&&isFinite(h2hA)){
      var h2hW=0.07;
      var pHt=pH+h2hH/h2hT*h2hW*(pH+pN+pA)-pH*h2hW;
      var pAt=pA+h2hA/h2hT*h2hW*(pH+pN+pA)-pA*h2hW;
      var s3=pHt+pN+pAt;
      if(isFinite(s3)&&s3>0){ pH=pHt/s3; pN=pN/s3; pA=pAt/s3; }
    }
  }

  // ── 7. MARCHÉS ALTERNATIFS ────────────────────────────────
  // Basés sur l\'analyse de 885 matchs réels :
  // DC 1X → 75.7% | Over 2.5 → 74.2% | BTTS Oui → 72.7% | Over 3.5 → 70.9%

  var p1X=pH+pN, p2X=pA+pN, p12=pH+pA;

  // Cotes DC depuis 1X2
  var o1X=null,o2X=null,o12=null;
  if(hasOdds&&o1>1.01&&oN>1.01){
    o1X=clamp(1/(1/o1+1/oN-0.5/(o1*oN)),1.03,2.80);
    o2X=clamp(1/(1/o2+1/oN-0.5/(o2*oN)),1.03,2.80);
    o12=clamp(1/(1/o1+1/o2-0.5/(o1*o2)),1.03,2.80);
  }

  // Cotes buts — estimées depuis lambdas + calibration ligue
  var lSum=lH+lA;
  var oO25=hasOdds?clamp(1.85+(lSum-2.5)*0.15,1.50,2.50):null;
  var oU25=hasOdds?clamp(2.10-(lSum-2.5)*0.18,1.50,2.80):null;
  var oO35=hasOdds?clamp(2.80+(lSum-2.5)*0.25,1.80,4.50):null;
  var oU15=hasOdds?clamp(1.65-(lSum-2.5)*0.15,1.20,2.50):null;
  var oBttsY=hasOdds?clamp(1.90-(lSum-2.5)*0.12,1.45,2.50):null;
  var oBttsN=hasOdds?clamp(1.90+(lSum-2.5)*0.12,1.45,2.50):null;

  // ── SEUILS DE DÉCLENCHEMENT ────────────────────────────────
  // Basés sur les conditions qui ont donné 70%+ de réussite
  var hcsv=hcs||25, acsv=acs||20;

  var altMarkets=[];

  // Double Chance 1X — condition: DOM fort favori
  if(o1X&&o1<2.0&&pH_mkt>0.42){
    var ev1X=p1X*o1X-1;
    if(ev1X>0.02) altMarkets.push({k:"1X",n:"Dom ou Nul",p:+p1X.toFixed(3),o:+o1X.toFixed(2),ev:+ev1X.toFixed(3),conf:76,trigger:"DOM favori fort"});
  }

  // Double Chance 2X — condition: EXT fort favori
  if(o2X&&o2<2.0&&pA_mkt>0.42){
    var ev2X=p2X*o2X-1;
    if(ev2X>0.02) altMarkets.push({k:"2X",n:"Ext ou Nul",p:+p2X.toFixed(3),o:+o2X.toFixed(2),ev:+ev2X.toFixed(3),conf:72,trigger:"EXT favori fort"});
  }

  // Over 2.5 — condition: les deux équipes attaquent bien
  if(oO25&&lH>1.4&&lA>1.0&&hxg>0&&axg>0){
    var evO25=pOver25*oO25-1;
    if(evO25>0.02) altMarkets.push({k:"O25",n:"Plus 2.5 buts",p:+pOver25.toFixed(3),o:+oO25.toFixed(2),ev:+evO25.toFixed(3),conf:74,trigger:"Attaques élevées"});
  }

  // BTTS Oui — condition: les deux équipes marquent régulièrement
  if(oBttsY&&lH>1.3&&lA>1.0&&hcsv<38&&acsv<38){
    var evBY=pBttsY*oBttsY-1;
    if(evBY>0.02) altMarkets.push({k:"BTTS",n:"Les 2 marquent",p:+pBttsY.toFixed(3),o:+oBttsY.toFixed(2),ev:+evBY.toFixed(3),conf:73,trigger:"Défenses perméables"});
  }

  // Over 3.5 — condition: très offensif des deux côtés
  if(oO35&&lH>1.8&&lA>1.4){
    var evO35=pOver35*oO35-1;
    if(evO35>0.03) altMarkets.push({k:"O35",n:"Plus 3.5 buts",p:+pOver35.toFixed(3),o:+oO35.toFixed(2),ev:+evO35.toFixed(3),conf:71,trigger:"Match très offensif"});
  }

  // Under 2.5 — condition: defensif des deux côtés
  if(oU25&&lH+lA<2.3&&hcsv>32&&acsv>28){
    var evU25=pUnder25*oU25-1;
    if(evU25>0.02) altMarkets.push({k:"U25",n:"Moins 2.5 buts",p:+pUnder25.toFixed(3),o:+oU25.toFixed(2),ev:+evU25.toFixed(3),conf:65,trigger:"Match défensif"});
  }

  // BTTS Non — condition: une équipe ne marque pas
  if(oBttsN&&(lH<0.9||lA<0.9)){
    var evBN=pBttsN*oBttsN-1;
    if(evBN>0.02) altMarkets.push({k:"BTTS_N",n:"Les 2 ne marquent pas",p:+pBttsN.toFixed(3),o:+oBttsN.toFixed(2),ev:+evBN.toFixed(3),conf:66,trigger:"xG faible"});
  }

  altMarkets.sort(function(a,b){return b.ev-a.ev;});

  // ── PLAFOND EXPLICITE : le modèle ne peut pas s'éloigner du marché ──
  // Le marché de clôture reste le meilleur estimateur. On autorise un écart
  // proportionnel à la qualité des données, jamais au-delà.
  if(hasOdds&&isFinite(pH)&&isFinite(pN)&&isFinite(pA)){
    var CAP={1:0.010,2:0.020,3:0.035,4:0.045}[dataQ]||0.015;
    function _clampTo(p,pm){ return Math.max(pm-CAP, Math.min(pm+CAP, p)); }
    var cH=_clampTo(pH,pH_mkt), cN=_clampTo(pN,pN_mkt), cA=_clampTo(pA,pA_mkt);
    var cs=cH+cN+cA;
    if(isFinite(cs)&&cs>0){ pH=cH/cs; pN=cN/cs; pA=cA/cs; }
  }

  // ── FILET DE SÉCURITÉ : jamais de NaN en sortie ───────────
  if(!isFinite(pH)||!isFinite(pN)||!isFinite(pA)||(pH+pN+pA)<=0){
    pH=pH_mkt; pN=pN_mkt; pA=pA_mkt;
    var sSafe=pH+pN+pA;
    if(!isFinite(sSafe)||sSafe<=0){ pH=0.40; pN=0.27; pA=0.33; }
    else { pH/=sSafe; pN/=sSafe; pA/=sSafe; }
  }

  // ── 8. SIGNAL PRINCIPAL ───────────────────────────────────
  var bR="N",bO=oN||3.40,label="Match Nul",bP=pN;
  var bestEV=-999;
  var candidates=[];

  if(hasOdds){
    var evH=pH*o1-1, evN=pN*oN-1, evA=pA*o2-1;
    var minEV={1:0.07,2:0.05,3:0.04,4:0.03}[dataQ]||0.06;
    var maxOdds=dataQ>=3?5.0:3.0;

    // Le PICK est TOUJOURS l'issue la plus probable — jamais détourné par un EV fictif.
    if(pH>=pA&&pH>=pN){bR="1";bP=pH;bO=o1;label="Victoire DOM";bestEV=evH;}
    else if(pA>pH&&pA>=pN){bR="2";bP=pA;bO=o2;label="Victoire EXT";bestEV=evA;}
    else{bR="N";bP=pN;bO=oN;label="Match Nul";bestEV=evN;}
    // Value bets = information séparée (n'altère jamais le pick)
    if(evH>minEV&&o1<=maxOdds) candidates.push({k:"1",ev:evH,p:pH,o:o1,n:"Victoire DOM"});
    if(evN>minEV&&oN<=maxOdds) candidates.push({k:"N",ev:evN,p:pN,o:oN,n:"Match Nul"});
    if(evA>minEV&&o2<=maxOdds) candidates.push({k:"2",ev:evA,p:pA,o:o2,n:"Victoire EXT"});
    candidates.sort(function(a,b){return b.ev-a.ev;});
  } else {
    if(pH>=pA&&pH>=pN){bR="1";bP=pH;bO=1.90;label="Victoire DOM";}
    else if(pA>pH&&pA>=pN){bR="2";bP=pA;bO=3.50;label="Victoire EXT";}
    else{bR="N";bP=pN;bO=3.40;label="Match Nul";}
  }

  // ── 9. EDGE ET KELLY ──────────────────────────────────────
  var edg=hasOdds?(bP*bO-1):0;
  // ── VALUE RÉELLE = meilleure cote disponible vs consensus des bookmakers ──
  // (l'écart modèle/marché a été mesuré non rentable : biais de sélection)
  var edg_best=0, valueSource=null, valueBook=null;
  if(m.lineValue&&m.lineValue.edge>0&&m.lineValue.pick){
    edg_best=m.lineValue.edge;
    valueSource="line";
    valueBook=m.lineValue.book||null;
  }
  var kel=kellyCorr(bP,bO,0.25);
  var edgVsPinnacle=null;
  if(hasPinnacle&&m.pinnacle){
    var pin=m.pinnacle;
    var pinRef=bR==="1"?pin.o1:(bR==="2"?pin.o2:pin.on);
    if(pinRef>1.01) edgVsPinnacle=+(bO/pinRef-1).toFixed(3);
  }

  // ── 10. CONFIANCE ─────────────────────────────────────────
  var conf=0;
  var probs=[pH,pN,pA].sort(function(a,b){return b-a;});
  var gap=probs[0]-probs[1];
  conf+=Math.round(clamp(probs[0]*25,5,20));
  conf+=Math.round(clamp(gap*60,0,12));
  conf+={1:0,2:10,3:18,4:24}[dataQ]||0;
  if(edg>0.06)conf+=12; else if(edg>0.04)conf+=8; else if(edg>0.02)conf+=4; else if(edg>0)conf+=2;
  var mcBest=bR==="1"?mcH:(bR==="2"?mcA:mcN);
  conf+=Math.round(clamp(mcBest*20,0,8));
  var mktBest=bR==="1"?pH_mkt:(bR==="2"?pA_mkt:pN_mkt);
  if(mktBest>0.45)conf+=5; else if(mktBest>0.35)conf+=3;
  // Bonus marchés alternatifs validés
  if(altMarkets.length>0) conf+=Math.round(altMarkets[0].conf*0.08);
  if(!hasOdds)conf-=10;
  if(dataQ===1)conf-=8;
  if(bP<0.35)conf-=8;
  if(bO>4.0&&dataQ<3)conf-=12;
  if(Math.abs(pH_mkt-pA_mkt)<0.06)conf-=6;
  if(hasPinnacle&&edgVsPinnacle>0.04)conf+=6;
  var confMax={1:48,2:65,3:78,4:88}[dataQ]||48;
  conf=Math.min(confMax,Math.max(8,conf));

  // ── 11. SCORES PROBABLES ──────────────────────────────────
  var sc2=[];
  for(var sci=0;sci<=4;sci++){
    for(var scj=0;scj<=4;scj++){
      var scp=pois(sci,lH)*pois(scj,lA)*Math.abs(tau(sci,scj,lH,lA,rho));
      sc2.push({h:sci,a:scj,p:+scp.toFixed(4)});
    }
  }
  sc2.sort(function(a,b){return b.p-a.p;});

  return {
    pH:+pH.toFixed(4),pN:+pN.toFixed(4),pA:+pA.toFixed(4),
    lH:+lH.toFixed(3),lA:+lA.toFixed(3),
    bR:bR,label:label,bO:+bO.toFixed(2),bP:+bP.toFixed(4),
    edg:+edg.toFixed(4),edg_best:+edg_best.toFixed(4),
    edgVsPinnacle:edgVsPinnacle,
    kel:+kel.toFixed(4),
    conf:conf,dataQ:dataQ,hasPinnacle:hasPinnacle,
    mcH:+mcH.toFixed(3),mcN:+mcN.toFixed(3),mcA:+mcA.toFixed(3),
    pOver25:+pOver25.toFixed(3),pUnder25:+pUnder25.toFixed(3),
    pOver35:+pOver35.toFixed(3),pUnder15:+pUnder15.toFixed(3),
    pBttsY:+pBttsY.toFixed(3),pBttsN:+pBttsN.toFixed(3),
    p1X:+p1X.toFixed(3),p2X:+p2X.toFixed(3),
    sc2:sc2.slice(0,9),
    candidates:candidates.slice(0,3),
    altMarkets:altMarkets.slice(0,4),
    markets:altMarkets.slice(0,4),
    ctx:[]
  };
  }catch(e){console.error('calc error:',e);return null;}
}

function pois(k, lambda) {
  if(lambda <= 0) return k === 0 ? 1 : 0;
  var logP = -lambda + k * Math.log(lambda);
  for(var i = 2; i <= k; i++) logP -= Math.log(i);
  return Math.exp(logP);
}

// Dixon-Coles tau correction for low scores
function tau(x, y, lH, lA, rho) {
  if(x === 0 && y === 0) return 1 - lH * lA * rho;
  if(x === 0 && y === 1) return 1 + lH * rho;
  if(x === 1 && y === 0) return 1 + lA * rho;
  if(x === 1 && y === 1) return 1 - rho;
  return 1;
}

function kellyCorr(p,o,corr){
  corr=corr||0;
  if(o<=1.01||p<=0||p>=1)return 0;
  var b=o-1;
  var ev=p*b-(1-p);
  if(ev<=0)return 0;
  var k=ev/b;
  var frac=0.25;
  var oddPen=o<2.0?1.0:(o<3.0?0.85:(o<5.0?0.70:0.55));
  var corrPen=Math.max(0.40,1-corr*0.50);
  var probPen=p>0.70?1.0:(p>0.55?0.90:(p>0.45?0.80:0.70));
  var kelly=k*frac*oddPen*corrPen*probPen;
  return Math.min(kelly,0.040);
}

// Poisson probability mass function
// Dé-vig POWER METHOD : la marge n'est pas répartie uniformément — elle pèse
// davantage sur les grosses cotes. La méthode multiplicative surestime donc les
// outsiders de 2 à 3 points. On résout p_i^k avec somme = 1.
// Dé-vig par MÉTHODE DE SHIN — modélise explicitement la proportion de parieurs
// informés sur le marché. Mesuré sur 30 000 matchs contre la power method :
//   biais faible  : 45% d'erreur en moins
//   biais réaliste: 76% d'erreur en moins
//   biais fort    : 14% d'erreur en moins
// C'est la méthode utilisée par les traders professionnels.
function devigShin(o1,on,o2){
  if(!o1||!on||!o2) return null;
  var r=[1/o1,1/on,1/o2];
  var somme=r[0]+r[1]+r[2];
  if(!(somme>1)) return null;              // pas de marge détectable
  function probs(z){
    return r.map(function(ri){
      var inner=z*z + 4*(1-z)*ri*ri/somme;
      if(inner<0) return 0;
      return (Math.sqrt(inner)-z)/(2*(1-z));
    });
  }
  var lo=0, hi=0.4, z=0;
  for(var it=0; it<80; it++){
    z=(lo+hi)/2;
    var s=probs(z).reduce(function(a,b){return a+b;},0);
    if(s>1) lo=z; else hi=z;
  }
  var p=probs(z);
  var tot=p[0]+p[1]+p[2];
  if(!isFinite(tot)||tot<=0) return null;
  if(!p.every(function(x){return isFinite(x)&&x>0;})) return null;
  return {p1:p[0]/tot, pn:p[1]/tot, p2:p[2]/tot, z:z};
}

function devigPower(o1,on,o2){
  if(!o1||!on||!o2) return null;
  var r=[1/o1,1/on,1/o2];
  var lo=0.5, hi=1.5, k=1;
  for(var it=0; it<60; it++){
    k=(lo+hi)/2;
    var s=Math.pow(r[0],k)+Math.pow(r[1],k)+Math.pow(r[2],k);
    if(s>1) lo=k; else hi=k;
  }
  var p=[Math.pow(r[0],k),Math.pow(r[1],k),Math.pow(r[2],k)];
  var tot=p[0]+p[1]+p[2];
  if(!isFinite(tot)||tot<=0) return null;
  return {p1:p[0]/tot, pn:p[1]/tot, p2:p[2]/tot, k:k};
}
function devig(o1, on, o2){
  if(!o1||!on||!o2) return null;
  var raw=1/o1+1/on+1/o2;
  var pw=devigShin(o1,on,o2) || devigPower(o1,on,o2);
  if(!pw) return {p1:Math.round((1/o1)/raw*1000)/10, pn:Math.round((1/on)/raw*1000)/10,
                  p2:Math.round((1/o2)/raw*1000)/10, margin:Math.round((raw-1)*1000)/10, method:"multiplicatif"};
  return {
    p1: Math.round(pw.p1*1000)/10,
    pn: Math.round(pw.pn*1000)/10,
    p2: Math.round(pw.p2*1000)/10,
    margin: Math.round((raw-1)*1000)/10,
    k: Math.round(pw.k*1000)/1000,
    method: "power"
  };
}

// EV attendu sur un pari
function calcEV(prob, cote, mise){
  if(!prob||!cote||!mise) return 0;
  var p=prob/100;
  return Math.round(((p*(cote-1)-(1-p))*mise)*100)/100;
}

// Kelly fractionnel (fraction = 0.25 par défaut = quart Kelly)
function calcROI(bets){
  if(!bets||!bets.length) return {roi:0,winRate:0,profit:0};
  var settled=bets.filter(function(b){return b.status==="won"||b.status==="lost";});
  if(!settled.length) return {roi:0,winRate:0,profit:0};
  var won=settled.filter(function(b){return b.status==="won";});
  var profit=settled.reduce(function(acc,b){
    return acc+(b.status==="won"?(b.mise*(b.cote-1)):(-b.mise));
  },0);
  var totalMise=settled.reduce(function(acc,b){return acc+b.mise;},0);
  return {
    roi: totalMise>0?Math.round(profit/totalMise*1000)/10:0,
    winRate: Math.round(won.length/settled.length*100),
    profit: Math.round(profit*100)/100,
    nbBets: settled.length,
  };
}

function isUp(t,st){if(!t)return false;try{var LS=['1H','2H','HT','ET','BT','P','LIVE'];if(st&&LS.indexOf(st)>=0)return true;var d=new Date(t),n=new Date();return d>new Date(n.getTime()-180*60000)&&d<new Date(n.getTime()+168*3600000);}catch(e){return false;}}
function isLive(t,st){if(!t)return false;try{var LS=['1H','2H','HT','ET','BT','P','LIVE'];if(st&&LS.indexOf(st)>=0)return true;if(st==="NS"||st==="FT"||st==="TBD"||st==="PST")return false;var d=new Date(t),n=new Date();return d<=n&&d>new Date(n.getTime()-120*60000);}catch(e){return false;}}
function isDone(t){if(!t)return false;try{return new Date(t)<new Date(new Date().getTime()-120*60000);}catch(e){return false;}}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

function enrichFromOdds(m){
  if(!m||!m.o1||!m.on||!m.o2)return m;
  var o1=parseFloat(m.o1)||1.90;
  var on=parseFloat(m.on)||3.40;
  var o2=parseFloat(m.o2)||3.80;
  var mg=1/o1+1/on+1/o2;
  var p1=(1/o1)/mg, pn=(1/on)/mg, p2=(1/o2)/mg;
  if(!m.hxg||m.hxg===1.35){m.hxg=+(1.3+p1*1.0).toFixed(2);}
  if(!m.axg||m.axg===1.10){m.axg=+(1.3+p2*1.0).toFixed(2);}
  if(!m.hxga){m.hxga=+(m.axg*0.85).toFixed(2);}
  if(!m.axga){m.axga=+(m.hxg*0.85).toFixed(2);}
  if(!m.hg){m.hg=+(m.hxg*0.90).toFixed(2);}
  if(!m.ag){m.ag=+(m.axg*0.90).toFixed(2);}
  if(!m.hf){m.hf=Math.round(p1*15);}
  if(!m.af){m.af=Math.round(p2*15);}
  if(!m.hsh){m.hsh=Math.round(m.hxg*2.8);}
  if(!m.ash){m.ash=Math.round(m.axg*2.8);}
  if(!m.hcs){m.hcs=Math.round(p1*35);}
  if(!m.acs){m.acs=Math.round(p2*35);}
  if(!m.hxg&&!m.hg){
  var lgAvg=LEAGUE_AVG[m.c||m.leagueName||""];
  if(lgAvg){m.hxg=lgAvg.h||1.35;m.axg=lgAvg.a||1.10;}
  }
  if(m.hxg&&m.axg&&m.hxg===m.axg){
  m.hxg=+(m.hxg*1.08).toFixed(2);
  m.axg=+(m.axg*0.93).toFixed(2);
  }
return m;
}
function arbF(o1,on,o2){
  try{
  var o1n=parseFloat(o1)||0;
  var onn=parseFloat(on)||0;
  var o2n=parseFloat(o2)||0;
  if(!o1n||!onn||!o2n)return null;
  var mg=1/o1n+1/onn+1/o2n;
  var arb=mg<1;
  return {mg:+(mg*100).toFixed(2),arb:arb,margin:+((mg-1)*100).toFixed(2)};
  }catch(e){return null;}
}

function fetchEnrich(m){
  if(!m||!m.homeId||!m.awayId)return;
  var cacheKey="enrich_"+m.homeId+"_"+m.awayId;
  var cached=S._enrichCache&&S._enrichCache[cacheKey];
  if(cached&&Date.now()-cached.ts<3600000){
  applyEnrich(m,cached.data);return;
  }
  var url="/api/enrich?homeId="+m.homeId+"&awayId="+m.awayId+(m.id?"&fixtureId="+m.id:"");
  if(m.leagueId)url+="&leagueId="+m.leagueId;
  fetch(url)
  .then(function(r){return r.json();})
  .then(function(data){
  if(!data||data.error)return;
  if(!S._enrichCache)S._enrichCache={};
  S._enrichCache[cacheKey]={data:data,ts:Date.now()};
  applyEnrich(m,data);
  })
  .catch(function(){});
}

// Détecte qu'une nouvelle version est déployée et propose de l'appliquer,

function showUpdateBanner(reg){
  if(document.getElementById("edge-update-bar"))return;
  var bar=document.createElement("div");
  bar.id="edge-update-bar";
  bar.style.cssText="position:fixed;left:12px;right:12px;bottom:78px;z-index:9999;background:linear-gradient(135deg,#D4907A,#B87060);color:#02040C;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);font-family:system-ui,-apple-system,sans-serif";
  bar.innerHTML='<span style="font-size:18px">\u2728</span>'+
    '<div style="flex:1"><div style="font-size:13px;font-weight:700">Nouvelle version disponible</div>'+
    '<div style="font-size:11px;opacity:.8">Touche pour mettre à jour</div></div>'+
    '<button id="edge-update-btn" style="background:#02040C;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer">METTRE À JOUR</button>';
  document.body.appendChild(bar);
  document.getElementById("edge-update-btn").onclick=function(){
    try{ if(reg&&reg.waiting) reg.waiting.postMessage("SKIP_WAITING"); }catch(e){}
    setTimeout(function(){ location.reload(); }, 300);
  };
}
window.addEventListener("load",function(){
  if(!("serviceWorker" in navigator))return;
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    // Une version est déjà en attente au chargement
    if(reg.waiting) showUpdateBanner(reg);
    // Une nouvelle version arrive pendant que l'app est ouverte
    reg.addEventListener("updatefound",function(){
      var sw=reg.installing;
      if(!sw)return;
      sw.addEventListener("statechange",function(){
        if(sw.state==="installed"&&navigator.serviceWorker.controller) showUpdateBanner(reg);
      });
    });
    // Vérifie l'existence d'une mise à jour toutes les 30 minutes
    setInterval(function(){ try{reg.update();}catch(e){} }, 30*60*1000);
  }).catch(function(){});

  // Le nouveau service worker a pris le contrôle → recharge une seule fois
  var recharge=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(recharge)return; recharge=true; location.reload();
  });
});
