<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,viewport-fit=cover"/>

<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<meta name="application-name" content="EDGE Pro"/>

<meta name="theme-color" content="#060810"/>
<meta name="msapplication-navbutton-color" content="#060810"/>
<meta name="msapplication-TileColor" content="#060810"/>

<title>EDGE Pro — Intelligence Sportive</title>

<link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png"/>

<!-- Polices — preconnect pour vitesse -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
</head>
<style>
/* ══════════════════════════════════════════════════
   EDGE — Design System v3
   Terminal Luxe · Bronze Olympique Rosé · Bleu Nuit
   ══════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  /* Palette */
  --bg:    #02040C;
  --bg2:   #04071A;
  --card:  #080C1E;
  --card2: #0A1028;
  --card3: #0D1430;
  --acc:   #D4907A;
  --acc2:  #E0A890;
  --acc3:  #EABBA6;
  --accL:  rgba(212,144,122,.15);
  --accL2: rgba(212,144,122,.08);
  --accB:  rgba(212,144,122,.25);
  --bl:    #3B8AFF;
  --bl2:   #6AABFF;
  --blL:   rgba(59,138,255,.12);
  --blB:   rgba(59,138,255,.22);
  --vert:  #00C47A;
  --rouge: #E03050;
  --vert2: rgba(0,196,122,.10);
  --rouge2:rgba(224,48,80,.10);
  --w:     #EDF1FF;
  --w80:   rgba(237,241,255,.80);
  --w55:   rgba(237,241,255,.55);
  --w30:   rgba(237,241,255,.30);
  --w12:   rgba(237,241,255,.12);
  --w06:   rgba(237,241,255,.06);
  --w03:   rgba(237,241,255,.03);
  --bord:  rgba(237,241,255,.07);
  --bord2: rgba(237,241,255,.12);

  /* Typography */
  --ft: 'Bebas Neue', sans-serif;
  --fb: 'DM Sans', sans-serif;
  --fm: 'DM Mono', monospace;

  /* Spacing scale */
  --s4:  4px;
  --s6:  6px;
  --s8:  8px;
  --s10: 10px;
  --s12: 12px;
  --s14: 14px;
  --s16: 16px;
  --s20: 20px;
  --s24: 24px;
  --s32: 32px;

  /* Border radius */
  --r1: 6px;
  --r2: 10px;
  --r3: 14px;
  --r4: 18px;
  --r5: 24px;

  /* Shadows */
  --sh1: 0 2px 8px rgba(0,0,0,.3);
  --sh2: 0 4px 16px rgba(0,0,0,.4);
  --sh3: 0 8px 32px rgba(0,0,0,.5);
}

/* ── Reset ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--w);
  font-family: var(--fb);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
* { -webkit-tap-highlight-color: transparent; }

/* ── Layout ─────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

#main {
  display: flex;
  flex-direction: column;
  flex: 1;
  width: 100%;
  overflow: hidden;
}

#page {
  flex: 1;
  width: 100%;
  padding: 16px 16px 96px;
  box-sizing: border-box;
  overflow-x: hidden;
  animation: fadeUp .18s ease;
}

/* ── Topbar ─────────────────────────────────────── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 300;
  width: 100%;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: rgba(2,4,12,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bord);
}

.tb-logo {
  font-family: var(--ft);
  font-size: 22px;
  letter-spacing: .12em;
  color: var(--w);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tb-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--fb);
  font-size: 13px;
  font-weight: 600;
  color: var(--w80);
  letter-spacing: .02em;
  white-space: nowrap;
  pointer-events: none;
}

.tb-r {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Live pill */
#livepill {
  display: none;
  align-items: center;
  gap: 4px;
  background: rgba(224,48,80,.10);
  border: 1px solid rgba(224,48,80,.25);
  border-radius: 20px;
  padding: 3px 8px;
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  color: var(--rouge);
  letter-spacing: .03em;
}

/* ── Bottom Nav ─────────────────────────────────── */
#sidebar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 300;
  background: rgba(2,4,12,.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--bord2);
  padding: 0 0 env(safe-area-inset-bottom, 6px);
}

#sb-nav {
  display: flex;
  align-items: stretch;
  height: 60px;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: none;
  background: transparent;
  color: var(--w30);
  transition: color .15s;
  position: relative;
}

.nav-btn.active {
  color: var(--acc);
}

.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 2px;
  background: var(--acc);
  border-radius: 0 0 2px 2px;
}

.nav-ic {
  font-size: 20px;
  line-height: 1;
}

.nav-lbl {
  font-family: var(--fb);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* ── Cards ──────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r4);
  overflow: hidden;
}

.card-value {
  background: var(--card);
  border: 1px solid var(--accB);
  border-radius: var(--r4);
  overflow: hidden;
  position: relative;
}

.card-value::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--acc), transparent);
}

/* Match Card */
.mc {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.mc:active {
  border-color: var(--accB);
  box-shadow: 0 0 0 1px var(--accL);
}

.mc.live {
  border-color: rgba(224,48,80,.2);
}

.mc.value {
  border-color: var(--accB);
}

.mc-stripe {
  height: 2px;
  width: 100%;
}

.mc-body { padding: 11px 13px 10px; }

.mc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.mc-league {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 500;
  color: var(--w30);
  letter-spacing: .03em;
  text-transform: uppercase;
}

.mc-teams {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.mc-team {
  flex: 1;
}

.mc-team-name {
  font-family: var(--fb);
  font-size: 13px;
  font-weight: 700;
  color: var(--w);
  line-height: 1.2;
  margin-bottom: 2px;
}

.mc-team-sub {
  font-size: 10px;
  color: var(--w30);
}

.mc-odds {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}

.mc-odd {
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r1);
  padding: 7px 4px;
  text-align: center;
}

.mc-odd-val {
  font-family: var(--fm);
  font-size: 14px;
  font-weight: 500;
  color: var(--w80);
  display: block;
}

.mc-odd-lbl {
  font-size: 9px;
  color: var(--w30);
  display: block;
  margin-top: 1px;
}

/* Signal badge */
.sig-badge {
  background: var(--accL2);
  border: 1px solid var(--accB);
  border-radius: var(--r1);
  padding: 5px 8px;
  text-align: center;
  min-width: 60px;
  flex-shrink: 0;
}

.sig-type {
  font-family: var(--ft);
  font-size: 14px;
  color: var(--acc);
  display: block;
  letter-spacing: .05em;
}

.sig-conf {
  font-size: 10px;
  color: var(--w30);
  display: block;
  margin-top: 1px;
}

.sig-edge {
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  color: var(--vert);
  display: block;
  margin-top: 2px;
}

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 700;
  color: var(--rouge);
  letter-spacing: .05em;
}

.live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--rouge);
  animation: pulse 1.4s ease infinite;
}

/* ── Typography system ──────────────────────────── */
.t-label {
  font-family: var(--ft);
  font-size: 11px;
  letter-spacing: .25em;
  color: var(--w30);
  text-transform: uppercase;
}

.t-title {
  font-family: var(--ft);
  font-size: 26px;
  letter-spacing: .04em;
  color: var(--w);
  line-height: 1;
}

.t-title-sm {
  font-family: var(--ft);
  font-size: 18px;
  letter-spacing: .04em;
  color: var(--w);
}

.t-body {
  font-family: var(--fb);
  font-size: 13px;
  color: var(--w55);
  line-height: 1.6;
}

.t-mono {
  font-family: var(--fm);
  font-size: 14px;
  color: var(--w);
}

.t-accent { color: var(--acc); }
.t-blue   { color: var(--bl2); }
.t-green  { color: var(--vert); }
.t-red    { color: var(--rouge); }
.t-muted  { color: var(--w30); }

/* ── Section headers ────────────────────────────── */
.sec-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.sec-bar {
  width: 3px;
  height: 16px;
  background: var(--acc);
  border-radius: 2px;
  flex-shrink: 0;
}

.sec-title {
  font-family: var(--ft);
  font-size: 13px;
  letter-spacing: .18em;
  color: var(--w);
  text-transform: uppercase;
}

/* ── Stat blocks ─────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat-card {
  background: var(--card2);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  padding: 12px 8px;
  text-align: center;
}

.stat-val {
  font-family: var(--ft);
  font-size: 24px;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-lbl {
  font-family: var(--fb);
  font-size: 9px;
  font-weight: 500;
  color: var(--w30);
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ── Buttons ─────────────────────────────────────── */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--r3);
  border: none;
  font-family: var(--ft);
  font-size: 14px;
  letter-spacing: .08em;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  width: 100%;
}

.btn:active { opacity: .8; transform: scale(.98); }

.btn-primary {
  background: linear-gradient(135deg, var(--acc), #B87060);
  color: #02040C;
}

.btn-secondary {
  background: var(--accL2);
  border: 1px solid var(--accB);
  color: var(--acc);
}

.btn-blue {
  background: var(--blL);
  border: 1px solid var(--blB);
  color: var(--bl2);
}

.btn-ghost {
  background: var(--w06);
  border: 1px solid var(--bord);
  color: var(--w55);
}

/* ── Value bet card ──────────────────────────────── */
.vb-card {
  background: var(--card);
  border: 1px solid var(--accB);
  border-radius: var(--r4);
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}

.vb-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--acc) 40%, transparent);
}

.vb-header {
  background: var(--accL3);
  border-bottom: 1px solid var(--accL);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.vb-body { padding: 14px; }

.vb-edge {
  font-family: var(--ft);
  font-size: 16px;
  color: var(--acc);
  letter-spacing: .05em;
}

.vb-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.vb-metric {
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r2);
  padding: 10px 6px;
  text-align: center;
}

.vb-metric-val {
  font-family: var(--fm);
  font-size: 15px;
  font-weight: 500;
  display: block;
  margin-bottom: 3px;
}

.vb-metric-lbl {
  font-size: 9px;
  color: var(--w30);
  letter-spacing: .05em;
  display: block;
}

/* ── Filter chips ────────────────────────────────── */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin-bottom: 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--bord);
  background: var(--w03);
  color: var(--w30);
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.chip.active {
  border-color: var(--accB);
  background: var(--accL2);
  color: var(--acc);
  font-weight: 600;
}

/* ── Tab bar (section tabs) ──────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  padding: 3px;
}

.tab-btn {
  flex: 1;
  padding: 7px 8px;
  border-radius: calc(var(--r3) - 3px);
  border: none;
  background: transparent;
  color: var(--w30);
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  text-align: center;
}

.tab-btn.active {
  background: var(--acc);
  color: #02040C;
}

/* ── Progress bar ────────────────────────────────── */
.progress {
  height: 4px;
  border-radius: 2px;
  background: var(--w06);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--acc), var(--acc2));
  transition: width .3s ease;
}

/* ── Divider ─────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--bord);
  margin: 12px 0;
}

/* ── Empty state ─────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  text-align: center;
}

.empty-icon { font-size: 36px; margin-bottom: 14px; }
.empty-title { font-family: var(--ft); font-size: 16px; letter-spacing: .1em; color: var(--w55); margin-bottom: 8px; }
.empty-sub { font-size: 12px; color: var(--w30); line-height: 1.6; }

/* ── Animations ──────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .35; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Error log ───────────────────────────────────── */
#err-log {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--rouge);
  color: #fff;
  font-size: 11px;
  font-family: var(--fm);
  padding: 8px 12px;
  z-index: 9999;
  word-break: break-all;
  max-height: 80px;
  overflow: auto;
}

/* ── Modal overlay ───────────────────────────────── */
#ovl {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  z-index: 400;
}

#ovl.show { display: flex; align-items: flex-end; justify-content: center; }

.modal {
  background: var(--card2);
  border: 1px solid var(--bord2);
  border-radius: var(--r5) var(--r5) 0 0;
  padding: 20px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow-y: auto;
}

/* ── Scrollbar ───────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--w12); border-radius: 2px; }

/* ── Input ───────────────────────────────────────── */
input[type=text], input[type=number], textarea {
  width: 100%;
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r2);
  padding: 10px 12px;
  color: var(--w);
  font-family: var(--fb);
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}

input:focus, textarea:focus {
  border-color: var(--accB);
}

/* ── Tooltip / tag ───────────────────────────────── */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 4px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .03em;
}

.tag-acc { background: var(--accL); color: var(--acc); }
.tag-blue { background: var(--blL); color: var(--bl2); }
.tag-green { background: var(--vert2); color: var(--vert); }
.tag-red { background: var(--rouge2); color: var(--rouge); }
</style>

<body>
<div id="err-log" style="display:none;position:fixed;top:0;left:0;right:0;background:red;color:white;font-size:11px;padding:8px;z-index:99999;word-break:break-all;max-height:120px;overflow:auto"></div>
<div id="app">
  <nav id="sidebar">
    <div id="sb-nav"></div>
  </nav>
  <div id="main">

function addManualBet(){
  var match=document.getElementById('bet-match');
  var label=document.getElementById('bet-label');
  var stake=document.getElementById('bet-stake');
  var odd=document.getElementById('bet-odd');
  if(!match||!stake||!odd)return;
  var matchV=(match.value||'').trim();
  var stakeV=parseFloat(stake.value);
  var oddV=parseFloat(odd.value);
  if(!matchV||!stakeV||stakeV<=0||!oddV||oddV<1.01){alert('Remplis tous les champs.');return;}
  var entry={id:Date.now(),match:matchV,bet:label?label.value.trim():'',stake:stakeV,odd:oddV,date:new Date().toLocaleDateString('fr-FR'),status:'pending',result:null,profit:null};
  S.hist=S.hist||[];S.hist.unshift(entry);
  try{localStorage.setItem('edge_hist',JSON.stringify(S.hist));}catch(e){}
  match.value='';if(label)label.value='';stake.value='';odd.value='';
  renderPage();
}
function settlebet(pendingIdx,result){
  var pending=(S.hist||[]).filter(function(e){return e.status==='pending';});
  var entry=pending[pendingIdx];
  if(!entry)return;
  var globalIdx=S.hist.indexOf(entry);
  if(globalIdx<0)return;
  S.hist[globalIdx].status='settled';
  S.hist[globalIdx].result=result;
  S.hist[globalIdx].profit=result==='WIN'?+(entry.stake*(entry.odd-1)).toFixed(2):-Math.abs(entry.stake);
  var totalProfit=(S.hist||[]).filter(function(e){return e.status==='settled';}).reduce(function(a,e){return a+(+e.profit||0);},0);
  var bkStart=+(localStorage.getItem('edge_bk_start')||1000);
  S.bk=+(bkStart+totalProfit).toFixed(2);
  try{localStorage.setItem('edge_hist',JSON.stringify(S.hist));localStorage.setItem('edge_bk',String(S.bk));}catch(e){}
  renderPage();
}
function quickAddBet(){
  var sm=S.selM,r=S.res;
  if(!sm||!r||!r.pari1){alert('Analyse un match d\'abord.');return;}
  var pari=r.pari1;
  var kelMise=pari.kelly>0?Math.round((S.bk||1000)*pari.kelly):25;
  var entry={id:Date.now(),match:(sm.h||'')+" vs "+(sm.a||''),bet:pari.label||'Signal EDGE',stake:kelMise,odd:+(pari.odd||1.90).toFixed(2),date:new Date().toLocaleDateString('fr-FR'),status:'pending',result:null,profit:null,edgeBR:r.bR,edgeConf:r.conf};
  S.hist=S.hist||[];S.hist.unshift(entry);
  try{localStorage.setItem('edge_hist',JSON.stringify(S.hist));}catch(e){}
  alert('Pari enregistre: '+entry.match+'\n'+entry.bet+' @ '+entry.odd+'x\nMise: '+entry.stake+'e\nVa dans Bankroll pour valider le resultat.');
  renderPage();
}

function callAI(prompt,max,retries){

  return fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({messages:[{role:"user",content:prompt}],
  system:"Tu es EDGE, expert en analyse de paris sportifs. Tu analyses les matchs avec rigueur : probabilites, value bets, gestion du risque. Sois direct, humain, sans jargon technique. Donne toujours un avis clair et une recommandation concrete. 18+ — tu rappelles toujours de parier responsablement.",
  max_tokens:max}),signal:controller?controller.signal:undefined})
  .then(function(r){if(tid)clearTimeout(tid);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(data){if(data.error)throw new Error(data.error);return data.text||data.content||"";})

function explainProno(edg,bO,m,bR){
  var reasons=[],risks=[];
  if(edg>0.08)reasons.push("Edge exceptionnel +"+((edg)*100).toFixed(1)+"% - rare opportunite");
  else if(edg>0.05)reasons.push("Edge solide +"+((edg)*100).toFixed(1)+"% - value confirmee");
  else if(edg>0.03)reasons.push("Edge positif +"+((edg)*100).toFixed(1)+"% - legere value");
  else risks.push("Edge faible - pari a eviter");
  if(m.derby)risks.push("Derby - resultat impredictible");
  if(m.hf&&bR==="1"){if(m.hf>=12)reasons.push("Bonne forme domicile ("+m.hf+"/15 pts)");else if(m.hf<=5)risks.push("Mauvaise forme domicile");}
  if(m.af&&bR==="2"){if(m.af>=12)reasons.push("Bonne forme exterieur");else if(m.af<=5)risks.push("Mauvaise forme exterieur");}
  if(m.o1&&m.on&&m.o2){var mg=(1/m.o1+1/m.on+1/m.o2-1)*100;if(mg<3)reasons.push("Marche liquide - cotes fiables");else if(mg>8)risks.push("Marge elevee ("+mg.toFixed(1)+"%) - cotes moins fiables");}
  if(bO>=1.50)reasons.push("Cote correcte @ "+bO.toFixed(2)+" - bon rapport risque/gain");
  else if(bO<1.30)risks.push("Cote tres basse @ "+bO.toFixed(2)+" - mise reduite");
  return{reasons:reasons,risks:risks};
}

function generateSentiment(r,d){
  if(!r||!d)return null;
  var pH=r.pH||0.33,pA=r.pA||0.33;
  var edg=r.edg||0;
  var hf=d.hF||8,af=d.aF||6;
  var motivH=d.motivH||0,motivA=d.motivA||0;
  var buzzH=Math.round(Math.min(95,Math.max(20,
  50 + pH*30 + (hf/15)*15 + motivH*5
  )));
  var buzzA=Math.round(Math.min(95,Math.max(20,
  50 + pA*25 + (af/15)*10 + motivA*5
  )));
  var labelH=buzzH>75?"En feu - Supporters optimistes":
  buzzH>60?"Confiance dans le groupe":
  buzzH>45?"Atmosph re mitig e":
  "Pression et inqui tude";
  var labelA=buzzA>70?"D termin s et motiv s":
  buzzA>55?"Groupe soud ":
  buzzA>40?"Match difficile attendu":
  "Peu d\'espoir des supporters";
  var moralH=motivH>1?"Excellente dynamique":
  motivH>0?"Bonne dynamique":
  motivH<-1?"Moral en berne":
  "Stable";
  var moralA=motivA>1?"Surprenante r gularit ":
  motivA>0?"Mont e en puissance":
  motivA<-1?"Groupe sous pression":
  "Stable";
  var engouement=Math.round(
  (buzzH+buzzA)/2
  +(d.derby?15:0)
  +(d.stakeLevel>=2?10:0)
  +((d.hRank<=4||d.aRank<=4)?8:0)
  );
  engouement=Math.min(99,Math.max(20,engouement));
  return{buzzH,buzzA,labelH,labelA,moralH,moralA,engouement};

function runScan(){
  if(!S.matches.length)return;
  S.scanLoad=true;S.scanRes=[];S.scanDone=false;renderPage();
  var results=[];
  S.matches.forEach(function(m){
  if(!m.e||!isUp(m.time||m.t))return;
  var e=m.e,mIdx=S.matches.indexOf(m),dataQ=e.dataQ||0;
  if(dataQ===0)return;
  var pairs=[];
  if(m.o1>1.10)pairs.push({id:"1",cat:"1X2",name:"Victoire DOM",p:e.pH,o:m.o1,real:true});
  if(m.on>1.10)pairs.push({id:"N",cat:"1X2",name:"Match Nul",p:e.pN,o:m.on,real:true});
  if(m.o2>1.10)pairs.push({id:"2",cat:"1X2",name:"Victoire EXT",p:e.pA,o:m.o2,real:true});
  if(m.o1>1&&m.on>1){var o1x=+(1/(1/m.o1+1/m.on)*0.95).toFixed(2);if(o1x>1.05)pairs.push({id:"1X",cat:"DC",name:"DOM ou Nul",p:e.pH+e.pN,o:o1x,real:false});}
  if(m.o2>1&&m.on>1){var ox2=+(1/(1/m.o2+1/m.on)*0.95).toFixed(2);if(ox2>1.05)pairs.push({id:"X2",cat:"DC",name:"EXT ou Nul",p:e.pN+e.pA,o:ox2,real:false});}
  if(m.oO25>1.05)pairs.push({id:"O25",cat:"Buts",name:"Plus 2.5 buts",p:e.o25||0,o:m.oO25,real:true});
  else if(e.o25>0.1)pairs.push({id:"O25",cat:"Buts",name:"Plus 2.5 buts",p:e.o25,o:+(1/e.o25*1.07).toFixed(2),real:false});
  if(m.oU25>1.05)pairs.push({id:"U25",cat:"Buts",name:"Moins 2.5 buts",p:e.u25||0,o:m.oU25,real:true});
  else if(e.u25>0.1)pairs.push({id:"U25",cat:"Buts",name:"Moins 2.5 buts",p:e.u25,o:+(1/e.u25*1.07).toFixed(2),real:false});
  if(m.oBtts>1.05)pairs.push({id:"BTTS",cat:"BTTS",name:"Les 2 marquent",p:e.btts||0,o:m.oBtts,real:true});
  else if(e.btts>0.1)pairs.push({id:"BTTS",cat:"BTTS",name:"Les 2 marquent",p:e.btts,o:+(1/e.btts*1.07).toFixed(2),real:false});
  pairs.forEach(function(b){
  if(!b.p||!b.o||b.p<=0||b.o<1.05)return;
  var ev=b.p*b.o-1;
  var edgBrut=b.p-(1/b.o);
  var seuilEV=b.real?(dataQ>=3?0.025:dataQ>=2?0.035:0.055):(dataQ>=2?0.055:0.090);
  if(ev<seuilEV||b.p<0.08)return;
  var kf=(b.p*(b.o-1)-(1-b.p))/(b.o-1);
  var kel=kf>0?Math.min(kf*0.25,0.04):0;
  var qs=ev*35+(e.conf||50)/100*25+dataQ*8+(b.real?10:0)+(dataQ>=3?5:0)+Math.min(b.p*10,8)-(isLive(m.time||m.t)?3:0);
  results.push({m:m,mIdx:mIdx,betId:b.id,betName:b.name,betCat:b.cat,p:b.p,o:b.o,ev:ev,edg:edgBrut,kel:kel,conf:e.conf||50,dataQ:dataQ,hasRealOdds:b.real,qualScore:qs,isLive:isLive(m.time||m.t)});
  });
  });
  results.sort(function(a,b){return b.qualScore-a.qualScore;});
  var seen={};
  S.scanRes=results.filter(function(r){
  var k=r.mIdx+"_"+r.betCat;
  if(!seen[k]){seen[k]=1;return true;}
  if(seen[k]<2){seen[k]++;return true;}
  return false;
  });
  S.scanLoad=false;S.scanDone=true;renderPage();
}

  });
  S.matches.sort(function(a,b){

  return (a.time||"")<(b.time||"")?-1:1;
  });
  S.matches.forEach(function(m,i){m.idx=i;});
  S.mLoad=false;S.mErr="";S.hasReal=true;
  S.mUpd=new Date().toISOString();
  var upCount=S.matches.filter(function(m){return isUp(m.time||m.t,m.status);}).length;
  var lvCount=S.matches.filter(function(m){return isLive(m.time||m.t,m.status);}).length;
  if(lvCount>0) S.mTab="live";
  else if(upCount>0) S.mTab="upcoming";
  else S.mTab="done";
  renderPage();
  var enrichDelay=0;
  S.matches.forEach(function(m){
  if(m.homeId&&m.awayId&&m.leagueId){
  enrichDelay+=500;
  (function(match,delay){
  setTimeout(function(){
  try{fetchEnrich(match);}catch(e){}
  },delay);
  })(m,enrichDelay);

  });
  }catch(err){

  renderPage();
  }
  })
  .catch(function(){

  });

function calc(m){
  try{
  // ── UTILITAIRES ────────────────────────────────────────────
  var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
  var sf=function(v,fb){var n=parseFloat(v);return(isNaN(n)||n<=0)?fb:n;};
  var sfz=function(v,fb){var n=parseFloat(v);return isNaN(n)?fb:n;};

  // ── 1. DONNÉES ─────────────────────────────────────────────
  var lgKey=m.c||m.leagueName||"DEFAULT";
  var lgD=LEAGUE_AVG[lgKey]||LEAGUE_AVG["DEFAULT"];
  var lg_h=lgD.h, lg_a=lgD.a, base_rho=lgD.rho;

  var o1=sf(m.o1,0), oN=sf(m.on||m.oN,0), o2=sf(m.o2,0);
  var hasOdds=o1>1.05&&oN>1.05&&o2>1.05;

  var hxg=sf(m.hxg||m.hXG,0), axg=sf(m.axg||m.aXG,0);
  var hg=sf(m.hg||m.hG,0),    ag=sf(m.ag||m.aG,0);
  var hxga=sf(m.hxga||m.hXGA,0), axga=sf(m.axga||m.aXGA,0);
  var hf=sfz(m.hf||m.hF,null), af=sfz(m.af||m.aF,null);
  var hcs=sfz(m.hcs,null), acs=sfz(m.acs,null);
  var hRank=sfz(m.hRank,null), aRank=sfz(m.aRank,null);

  var hasXG=(hxg>0.1||hg>0.1)&&(axg>0.1||ag>0.1);
  var hasForm=hf!==null&&af!==null;
  var hasH2H=!!(m.h2hStats&&m.h2hStats.total>=3);
  var hasPinnacle=!!(m.pinnacle||m.hasSharp);
  var dataQ=1;
  if(hasXG) dataQ=2;
  if(hasXG&&hasForm) dataQ=3;
  if(dataQ>=2&&(hasH2H||hasPinnacle)) dataQ=4;

  if(!hasOdds&&!hasXG) return null;

  // ── 2. PROBABILITÉ MARCHÉ ──────────────────────────────────
  var pH_mkt=0.33, pN_mkt=0.33, pA_mkt=0.34;
  if(hasOdds){
    var mg=1/o1+1/oN+1/o2;
    pH_mkt=(1/o1)/mg; pN_mkt=(1/oN)/mg; pA_mkt=(1/o2)/mg;
  }

  // ── 3. LAMBDAS ─────────────────────────────────────────────
  var haKey=lgKey;
  var homeAdv=(HOME_ADV&&HOME_ADV[haKey])||HOME_ADV["DEFAULT"]||0.08;
  var lH=lg_h*(1+homeAdv);
  var lA=lg_a*(1-homeAdv*0.5);

  if(hasXG){
    var hAtk=hxg>0?hxg:(hg>0?hg:lg_h);
    var aAtk=axg>0?axg:(ag>0?ag:lg_a);
    var hDef=hxga>0.2?hxga:lg_a;
    var aDef=axga>0.2?axga:lg_h;
    var lH_r=(hAtk/lg_h)*(lg_a/Math.max(hDef,0.5))*lg_h*(1+homeAdv);
    var lA_r=(aAtk/lg_a)*(lg_h/Math.max(aDef,0.5))*lg_a;
    var played=sf(m.hMatchesPlayed,0)+sf(m.aMatchesPlayed,0);
    var w=clamp(played/24,0.3,1.0);
    lH=clamp(lH_r*w+lg_h*(1-w),0.5,4.0);
    lA=clamp(lA_r*w+lg_a*(1-w),0.3,3.5);
  }

  }

  // ── 5. MONTE CARLO 800 ────────────────────────────────────

  function rp(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L&&k<15);return k-1;}
  for(var si=0;si<MC;si++){
    var gh=rp(lH),ga=rp(lA);
    if(gh>ga)mcH++; else if(ga>gh)mcA++; else mcN++;
  }
  mcH/=MC; mcN/=MC; mcA/=MC;

  var mcW=dataQ>=3?0.20:0.15;
  var pH_model=pH_dc*(1-mcW)+mcH*mcW;

  var pA_model=pA_dc*(1-mcW)+mcA*mcW;
  var s1=pH_model+pN_model+pA_model;

  // ── 6. FUSION BAYÉSIENNE ──────────────────────────────────

  var pA=pA_model*(1-mktW)+pA_mkt*mktW;

  var oO35=hasOdds?clamp(2.80+(lSum-2.5)*0.25,1.80,4.50):null;
  var oU15=hasOdds?clamp(1.65-(lSum-2.5)*0.15,1.20,2.50):null;

    for(var scj=0;scj<=4;scj++){
      var scp=pois(sci,lH)*pois(scj,lA)*Math.abs(tau(sci,scj,lH,lA,rho));
      sc2.push({h:sci,a:scj,p:+scp.toFixed(4)});
    }
  }
  sc2.sort(function(a,b){return b.p-a.p;});

  return {
    pH:+pH.toFixed(4),pN:+pN.toFixed(4),pA:+pA.toFixed(4),
    lH:+lH.toFixed(3),lA:+lA.toFixed(3),
    bR:bR,label:label,bO:+bO.toFixed(2),bP:+bP.toFixed(4),
    edg:+edg.toFixed(4),edg_best:+edg_best.toFixed(4),
    edgVsPinnacle:edgVsPinnacle,
    kel:+kel.toFixed(4),
    conf:conf,dataQ:dataQ,hasPinnacle:hasPinnacle,
    mcH:+mcH.toFixed(3),mcN:+mcN.toFixed(3),mcA:+mcA.toFixed(3),
    pOver25:+pOver25.toFixed(3),pUnder25:+pUnder25.toFixed(3),
    pOver35:+pOver35.toFixed(3),pUnder15:+pUnder15.toFixed(3),
    pBttsY:+pBttsY.toFixed(3),pBttsN:+pBttsN.toFixed(3),
    p1X:+p1X.toFixed(3),p2X:+p2X.toFixed(3),
    sc2:sc2.slice(0,9),
    candidates:candidates.slice(0,3),
    altMarkets:altMarkets.slice(0,4),
    markets:altMarkets.slice(0,4),
    ctx:[]
  };
  }catch(e){console.error('calc error:',e);return null;}
}


function pois(k, lambda) {
  if(lambda <= 0) return k === 0 ? 1 : 0;
  var logP = -lambda + k * Math.log(lambda);
  for(var i = 2; i <= k; i++) logP -= Math.log(i);
  return Math.exp(logP);
}

// Dixon-Coles tau correction for low scores
function tau(x, y, lH, lA, rho) {
  if(x === 0 && y === 0) return 1 - lH * lA * rho;
  if(x === 0 && y === 1) return 1 + lH * rho;
  if(x === 1 && y === 0) return 1 + lA * rho;
  if(x === 1 && y === 1) return 1 - rho;
  return 1;
}

function kellyCorr(p,o,corr){
  corr=corr||0;
  if(o<=1.01||p<=0||p>=1)return 0;
  var b=o-1;
  var ev=p*b-(1-p);
  if(ev<=0)return 0;
  var k=ev/b;
  var frac=0.25;
  var oddPen=o<2.0?1.0:(o<3.0?0.85:(o<5.0?0.70:0.55));
  var corrPen=Math.max(0.40,1-corr*0.50);
  var probPen=p>0.70?1.0:(p>0.55?0.90:(p>0.45?0.80:0.70));
  var kelly=k*frac*oddPen*corrPen*probPen;
  return Math.min(kelly,0.040);
}

// Poisson probability mass function
function devig(o1, on, o2){
  if(!o1||!on||!o2) return null;
  var p1=1/o1, pn=1/on, p2=1/o2;
  var margin=p1+pn+p2;
  return {
    p1: Math.round(p1/margin*1000)/10,
    pn: Math.round(pn/margin*1000)/10,
    p2: Math.round(p2/margin*1000)/10,
    margin: Math.round((margin-1)*1000)/10,
  };
}

// EV attendu sur un pari
function calcEV(prob, cote, mise){
  if(!prob||!cote||!mise) return 0;
  var p=prob/100;
  return Math.round(((p*(cote-1)-(1-p))*mise)*100)/100;
}

// Kelly fractionnel (fraction = 0.25 par défaut = quart Kelly)
function calcROI(bets){
  if(!bets||!bets.length) return {roi:0,winRate:0,profit:0};
  var settled=bets.filter(function(b){return b.status==="won"||b.status==="lost";});
  if(!settled.length) return {roi:0,winRate:0,profit:0};
  var won=settled.filter(function(b){return b.status==="won";});
  var profit=settled.reduce(function(acc,b){
    return acc+(b.status==="won"?(b.mise*(b.cote-1)):(-b.mise));
  },0);
  var totalMise=settled.reduce(function(acc,b){return acc+b.mise;},0);
  return {
    roi: totalMise>0?Math.round(profit/totalMise*1000)/10:0,
    winRate: Math.round(won.length/settled.length*100),
    profit: Math.round(profit*100)/100,
    nbBets: settled.length,
  };
}

return m;
