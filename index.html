<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,viewport-fit=cover"/>

<!-- PWA essentiels -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="EDGE Pro"/>
<meta name="application-name" content="EDGE Pro"/>

<!-- Theme color — Ocean Nuit -->
<meta name="theme-color" content="#060810"/>
<meta name="msapplication-navbutton-color" content="#060810"/>
<meta name="msapplication-TileColor" content="#060810"/>

<!-- SEO -->
<title>EDGE Pro — Intelligence Sportive</title>
<meta name="description" content="Analyse de paris sportifs basée sur Dixon-Coles, Monte Carlo et Bayesian. Value bets honnêtes, confiance chirurgicale."/>

<!-- Manifest PWA -->
<link rel="manifest" href="/manifest.json"/>

<!-- Icônes Apple -->
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png"/>
<link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png"/>

<!-- Icône standard -->
<link rel="icon" type="image/png" href="/icon-192.png"/>

<!-- Polices — preconnect pour vitesse -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet"/>

<!-- Splash screens iOS -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<!-- Cache control -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
</head>
<style>
/* ══════════════════════════════════════════════════
   EDGE — Design System v3
   Terminal Luxe · Bronze Olympique Rosé · Bleu Nuit
   ══════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  /* Palette */
  --bg:    #02040C;
  --bg2:   #04071A;
  --card:  #080C1E;
  --card2: #0A1028;
  --card3: #0D1430;
  --acc:   #D4907A;
  --acc2:  #E0A890;
  --acc3:  #EABBA6;
  --accL:  rgba(212,144,122,.15);
  --accL2: rgba(212,144,122,.08);
  --accB:  rgba(212,144,122,.25);
  --bl:    #3B8AFF;
  --bl2:   #6AABFF;
  --blL:   rgba(59,138,255,.12);
  --blB:   rgba(59,138,255,.22);
  --vert:  #00C47A;
  --rouge: #E03050;
  --vert2: rgba(0,196,122,.10);
  --rouge2:rgba(224,48,80,.10);
  --w:     #EDF1FF;
  --w80:   rgba(237,241,255,.80);
  --w55:   rgba(237,241,255,.55);
  --w30:   rgba(237,241,255,.30);
  --w12:   rgba(237,241,255,.12);
  --w06:   rgba(237,241,255,.06);
  --w03:   rgba(237,241,255,.03);
  --bord:  rgba(237,241,255,.07);
  --bord2: rgba(237,241,255,.12);

  /* Typography */
  --ft: 'Bebas Neue', sans-serif;
  --fb: 'DM Sans', sans-serif;
  --fm: 'DM Mono', monospace;

  /* Spacing scale */
  --s4:  4px;
  --s6:  6px;
  --s8:  8px;
  --s10: 10px;
  --s12: 12px;
  --s14: 14px;
  --s16: 16px;
  --s20: 20px;
  --s24: 24px;
  --s32: 32px;

  /* Border radius */
  --r1: 6px;
  --r2: 10px;
  --r3: 14px;
  --r4: 18px;
  --r5: 24px;

  /* Shadows */
  --sh1: 0 2px 8px rgba(0,0,0,.3);
  --sh2: 0 4px 16px rgba(0,0,0,.4);
  --sh3: 0 8px 32px rgba(0,0,0,.5);

  /* ── Alias legacy (anciennes pages → design system v3) ── */
  --v: var(--vert);
  --red: var(--rouge);
  --rougel: rgba(224,48,80,.12);
  --blanc: var(--w);
  --blanc2: var(--w80);
  --blanc3: var(--w55);
  --blanc4: var(--w30);
  --w20: rgba(237,241,255,.20);
  --w35: rgba(237,241,255,.35);
  --gris1: var(--w55);
  --gris2: var(--w30);
  --gris3: var(--w12);
  --jaune: var(--acc2);
  --jaune2: rgba(212,144,122,.14);
  --sauge: var(--vert);
  --sauge2: #00A868;
  --saugel: rgba(0,196,122,.12);
  --cyan: var(--bl2);
  --bleu-soft: rgba(59,138,255,.14);
  --violet2: var(--bl);
  --violet3: var(--blL);
  --m: var(--card);
  --m2: var(--card2);
  --m3: var(--card3);
  --c2: var(--card2);
  --c3: var(--card3);
  --ln: var(--bord);
  --ln2: var(--bord2);
  --ln-bleu: var(--blB);
  --sh-bleu: 0 4px 16px rgba(59,138,255,.15);
  --r: var(--r3);
  --f-mono: var(--fm);
  --f-titre: var(--ft);
  --accL3: rgba(212,144,122,.06);
}

/* ── Reset ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  width: 100%;
  overflow-x: hidden;
  color: var(--w);
  font-family: var(--fb);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
* { -webkit-tap-highlight-color: transparent; }

/* ── Layout ─────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  position: relative;
  background: var(--bg);
}
/* Plein écran jusqu'à 1100px — couvre mobile, tablette ET "site pour ordinateur" */
@media (min-width: 1100px) {
  #app { max-width: 620px; margin: 0 auto; box-shadow: 0 0 80px rgba(0,0,0,.6); }
  #sidebar { max-width: 620px; }
}

#main {
  display: flex;
  flex-direction: column;
  flex: 1;
  width: 100%;
  overflow: hidden;
}

#page {
  flex: 1;
  width: 100%;
  padding: 12px 12px 92px;
  box-sizing: border-box;
  overflow-x: hidden;
  animation: fadeUp .18s ease;
}

/* ── Topbar ─────────────────────────────────────── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 300;
  width: 100%;
  max-width: 100%;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: rgba(2,4,12,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bord);
}

.tb-logo {
  font-family: var(--ft);
  font-size: 22px;
  letter-spacing: .12em;
  color: var(--w);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tb-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--fb);
  font-size: 13px;
  font-weight: 600;
  color: var(--w80);
  letter-spacing: .02em;
  white-space: nowrap;
  pointer-events: none;
}

.tb-r {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Live pill */
#livepill {
  display: none;
  align-items: center;
  gap: 4px;
  background: rgba(224,48,80,.10);
  border: 1px solid rgba(224,48,80,.25);
  border-radius: 20px;
  padding: 3px 8px;
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  color: var(--rouge);
  letter-spacing: .03em;
}

/* ── Bottom Nav ─────────────────────────────────── */
#sidebar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  z-index: 300;
  background: rgba(2,4,12,.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--bord2);
  padding: 0 0 env(safe-area-inset-bottom, 6px);
}

#sb-nav {
  display: flex;
  align-items: stretch;
  height: 60px;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: none;
  background: transparent;
  color: var(--w30);
  transition: color .15s;
  position: relative;
}

.nav-btn.active {
  color: var(--acc);
}

.nav-btn.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 2px;
  background: var(--acc);
  border-radius: 0 0 2px 2px;
}

.nav-ic {
  font-size: 20px;
  line-height: 1;
}

.nav-lbl {
  font-family: var(--fb);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* ── Cards ──────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r4);
  overflow: hidden;
}

.card-value {
  background: var(--card);
  border: 1px solid var(--accB);
  border-radius: var(--r4);
  overflow: hidden;
  position: relative;
}

.card-value::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--acc), transparent);
}

/* Match Card */
.mc {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.mc:active {
  border-color: var(--accB);
  box-shadow: 0 0 0 1px var(--accL);
}

.mc.live {
  border-color: rgba(224,48,80,.2);
}

.mc.value {
  border-color: var(--accB);
}

.mc-stripe {
  height: 2px;
  width: 100%;
}

.mc-body { padding: 11px 13px 10px; }

.mc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.mc-league {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 500;
  color: var(--w30);
  letter-spacing: .03em;
  text-transform: uppercase;
}

.mc-teams {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.mc-team {
  flex: 1;
}

.mc-team-name {
  font-family: var(--fb);
  font-size: 13px;
  font-weight: 700;
  color: var(--w);
  line-height: 1.2;
  margin-bottom: 2px;
}

.mc-team-sub {
  font-size: 10px;
  color: var(--w30);
}

.mc-odds {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}

.mc-odd {
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r1);
  padding: 7px 4px;
  text-align: center;
}

.mc-odd-val {
  font-family: var(--fm);
  font-size: 14px;
  font-weight: 500;
  color: var(--w80);
  display: block;
}

.mc-odd-lbl {
  font-size: 9px;
  color: var(--w30);
  display: block;
  margin-top: 1px;
}

/* Signal badge */
.sig-badge {
  background: var(--accL2);
  border: 1px solid var(--accB);
  border-radius: var(--r1);
  padding: 5px 8px;
  text-align: center;
  min-width: 60px;
  flex-shrink: 0;
}

.sig-type {
  font-family: var(--ft);
  font-size: 14px;
  color: var(--acc);
  display: block;
  letter-spacing: .05em;
}

.sig-conf {
  font-size: 10px;
  color: var(--w30);
  display: block;
  margin-top: 1px;
}

.sig-edge {
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  color: var(--vert);
  display: block;
  margin-top: 2px;
}

/* Live badge */
.live-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 700;
  color: var(--rouge);
  letter-spacing: .05em;
}

.live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--rouge);
  animation: pulse 1.4s ease infinite;
}

/* ── Typography system ──────────────────────────── */
.t-label {
  font-family: var(--ft);
  font-size: 11px;
  letter-spacing: .25em;
  color: var(--w30);
  text-transform: uppercase;
}

.t-title {
  font-family: var(--ft);
  font-size: 26px;
  letter-spacing: .04em;
  color: var(--w);
  line-height: 1;
}

.t-title-sm {
  font-family: var(--ft);
  font-size: 18px;
  letter-spacing: .04em;
  color: var(--w);
}

.t-body {
  font-family: var(--fb);
  font-size: 13px;
  color: var(--w55);
  line-height: 1.6;
}

.t-mono {
  font-family: var(--fm);
  font-size: 14px;
  color: var(--w);
}

.t-accent { color: var(--acc); }
.t-blue   { color: var(--bl2); }
.t-green  { color: var(--vert); }
.t-red    { color: var(--rouge); }
.t-muted  { color: var(--w30); }

/* ── Section headers ────────────────────────────── */
.sec-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.sec-bar {
  width: 3px;
  height: 16px;
  background: var(--acc);
  border-radius: 2px;
  flex-shrink: 0;
}

.sec-title {
  font-family: var(--ft);
  font-size: 13px;
  letter-spacing: .18em;
  color: var(--w);
  text-transform: uppercase;
}

/* ── Stat blocks ─────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat-card {
  background: var(--card2);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  padding: 12px 8px;
  text-align: center;
}

.stat-val {
  font-family: var(--ft);
  font-size: 24px;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-lbl {
  font-family: var(--fb);
  font-size: 9px;
  font-weight: 500;
  color: var(--w30);
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ── Buttons ─────────────────────────────────────── */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--r3);
  border: none;
  font-family: var(--ft);
  font-size: 14px;
  letter-spacing: .08em;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  width: 100%;
}

.btn:active { opacity: .8; transform: scale(.98); }

.btn-primary {
  background: linear-gradient(135deg, var(--acc), #B87060);
  color: #02040C;
}

.btn-secondary {
  background: var(--accL2);
  border: 1px solid var(--accB);
  color: var(--acc);
}

.btn-blue {
  background: var(--blL);
  border: 1px solid var(--blB);
  color: var(--bl2);
}

.btn-ghost {
  background: var(--w06);
  border: 1px solid var(--bord);
  color: var(--w55);
}

/* ── Value bet card ──────────────────────────────── */
.vb-card {
  background: var(--card);
  border: 1px solid var(--accB);
  border-radius: var(--r4);
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}

.vb-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--acc) 40%, transparent);
}

.vb-header {
  background: var(--accL3);
  border-bottom: 1px solid var(--accL);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.vb-body { padding: 14px; }

.vb-edge {
  font-family: var(--ft);
  font-size: 16px;
  color: var(--acc);
  letter-spacing: .05em;
}

.vb-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.vb-metric {
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r2);
  padding: 10px 6px;
  text-align: center;
}

.vb-metric-val {
  font-family: var(--fm);
  font-size: 15px;
  font-weight: 500;
  display: block;
  margin-bottom: 3px;
}

.vb-metric-lbl {
  font-size: 9px;
  color: var(--w30);
  letter-spacing: .05em;
  display: block;
}

/* ── Filter chips ────────────────────────────────── */
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin-bottom: 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--bord);
  background: var(--w03);
  color: var(--w30);
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.chip.active {
  border-color: var(--accB);
  background: var(--accL2);
  color: var(--acc);
  font-weight: 600;
}

/* ── Tab bar (section tabs) ──────────────────────── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  padding: 3px;
}

.tab-btn {
  flex: 1;
  padding: 7px 8px;
  border-radius: calc(var(--r3) - 3px);
  border: none;
  background: transparent;
  color: var(--w30);
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  text-align: center;
}

.tab-btn.active {
  background: var(--acc);
  color: #02040C;
}

/* ── Progress bar ────────────────────────────────── */
.progress {
  height: 4px;
  border-radius: 2px;
  background: var(--w06);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--acc), var(--acc2));
  transition: width .3s ease;
}

/* ── Divider ─────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--bord);
  margin: 12px 0;
}

/* ── Empty state ─────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  text-align: center;
}

.empty-icon { font-size: 36px; margin-bottom: 14px; }
.empty-title { font-family: var(--ft); font-size: 16px; letter-spacing: .1em; color: var(--w55); margin-bottom: 8px; }
.empty-sub { font-size: 12px; color: var(--w30); line-height: 1.6; }

/* ── Animations ──────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .35; }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Error log ───────────────────────────────────── */
#err-log {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--rouge);
  color: #fff;
  font-size: 11px;
  font-family: var(--fm);
  padding: 8px 12px;
  z-index: 9999;
  word-break: break-all;
  max-height: 80px;
  overflow: auto;
}

/* ── Modal overlay ───────────────────────────────── */
#ovl {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  z-index: 400;
}

#ovl.show { display: flex; align-items: flex-end; justify-content: center; }

.modal {
  background: var(--card2);
  border: 1px solid var(--bord2);
  border-radius: var(--r5) var(--r5) 0 0;
  padding: 20px;
  width: 100%;
  max-width: 620px;
  max-height: 80vh;
  overflow-y: auto;
}

/* ── Scrollbar ───────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--w12); border-radius: 2px; }

/* ── Input ───────────────────────────────────────── */
input[type=text], input[type=number], textarea {
  width: 100%;
  background: var(--w03);
  border: 1px solid var(--bord);
  border-radius: var(--r2);
  padding: 10px 12px;
  color: var(--w);
  font-family: var(--fb);
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}

input:focus, textarea:focus {
  border-color: var(--accB);
}

/* ── Tooltip / tag ───────────────────────────────── */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 4px;
  font-family: var(--fb);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .03em;
}

.tag-acc { background: var(--accL); color: var(--acc); }
.tag-blue { background: var(--blL); color: var(--bl2); }
.tag-green { background: var(--vert2); color: var(--vert); }
.tag-red { background: var(--rouge2); color: var(--rouge); }

/* ══ ANIMATIONS PREMIUM ══════════════════════════ */

/* Cascade d'apparition des cartes au rendu */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
#page > * { animation: cardIn .32s cubic-bezier(.22,.9,.32,1.1) backwards; }
#page > *:nth-child(1) { animation-delay: 0s; }
#page > *:nth-child(2) { animation-delay: .04s; }
#page > *:nth-child(3) { animation-delay: .08s; }
#page > *:nth-child(4) { animation-delay: .12s; }
#page > *:nth-child(5) { animation-delay: .16s; }
#page > *:nth-child(6) { animation-delay: .20s; }
#page > *:nth-child(7) { animation-delay: .24s; }
#page > *:nth-child(8) { animation-delay: .27s; }
#page > *:nth-child(9) { animation-delay: .30s; }
#page > *:nth-child(n+10) { animation-delay: .33s; }

/* Feedback tactile — tout ce qui se presse répond */
.mc, .vb-card, .card[data-action], .chip, .btn, .nav-btn, .stat-card {
  transition: transform .12s ease, border-color .15s ease, box-shadow .2s ease, background .15s ease;
}
.mc:active, .vb-card:active, .card[data-action]:active { transform: scale(.982); }
.chip:active { transform: scale(.94); }
.btn:active { transform: scale(.97); }
.nav-btn:active .nav-ic { transform: scale(.85); }
.nav-ic { transition: transform .15s cubic-bezier(.34,1.56,.64,1); }

/* Cartes value — halo bronze qui respire doucement */
@keyframes valueGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(212,144,122,0); }
  50%     { box-shadow: 0 0 18px 0 rgba(212,144,122,.10); }
}
.mc.value, .vb-card { animation: cardIn .32s cubic-bezier(.22,.9,.32,1.1) backwards, valueGlow 3.2s ease-in-out .5s infinite; }

/* Skeleton loading — shimmer pendant le scan */
@keyframes shimmer {
  from { background-position: -200% 0; }
  to   { background-position: 200% 0; }
}
.skel {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r3);
  margin-bottom: 8px;
  overflow: hidden;
  position: relative;
}
.skel::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(237,241,255,.05) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
}
.skel-line {
  height: 11px; border-radius: 5px;
  background: var(--w06);
  margin: 0;
}

/* Live dot — double pulsation (point + onde) */
@keyframes liveWave {
  0%   { box-shadow: 0 0 0 0 rgba(224,48,80,.45); }
  70%  { box-shadow: 0 0 0 7px rgba(224,48,80,0); }
  100% { box-shadow: 0 0 0 0 rgba(224,48,80,0); }
}
.live-dot { animation: pulse 1.4s ease infinite, liveWave 1.4s ease infinite; }

/* Count-up des chiffres */
.stat-val { transition: color .3s ease; }
@keyframes numPop {
  0% { transform: scale(.7); opacity: 0; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
.num-pop { animation: numPop .5s cubic-bezier(.22,.9,.32,1.2) backwards; display: inline-block; }

/* Barre de progression — remplissage animé */
.progress-fill { animation: fillBar .8s cubic-bezier(.22,.9,.36,1) backwards; transform-origin: left; }
@keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Topbar — apparition douce du pill live */
#livepill { animation: cardIn .4s ease backwards; }

/* Accessibilité — respect du reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

@keyframes confFall {
  to { transform: translateY(105vh) rotate(600deg); opacity: 0; }
}

/* ══ RAFFINEMENT VISUEL ═════════════════════════ */

/* Matière des cartes : dégradé subtil + liseré lumineux en haut */
.card, .mc, .vb-card, .stat-card, .card-value {
  background-image: linear-gradient(178deg, rgba(237,241,255,.035) 0%, rgba(237,241,255,0) 42%);
  position: relative;
}
.card::before, .mc::before, .stat-card::before {
  content: '';
  position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(237,241,255,.09) 30%, rgba(237,241,255,.09) 70%, transparent);
  pointer-events: none;
}
.mc { box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px -8px rgba(0,0,0,.5); }
.mc.value {
  background-image: linear-gradient(178deg, rgba(212,144,122,.055) 0%, rgba(212,144,122,0) 48%);
  box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -10px rgba(212,144,122,.22);
}
.mc.live {
  background-image: linear-gradient(178deg, rgba(224,48,80,.045) 0%, rgba(224,48,80,0) 45%);
}

/* Chiffres : chasse fixe → les cotes s'alignent parfaitement en colonnes */
.mc-odd-val, .t-mono, .stat-val, .vb-metric-val, .sig-conf, .mc-time,
[class*="odd"], .vb-edge {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

/* Cotes : profondeur + réaction au toucher */
.mc-odd {
  background-image: linear-gradient(180deg, rgba(237,241,255,.045), rgba(237,241,255,.012));
  transition: background .15s ease, border-color .15s ease, transform .1s ease;
}
.mc-odd:active { transform: scale(.96); border-color: var(--accB); }

/* Badge signal : relief bronze */
.sig-badge {
  background-image: linear-gradient(160deg, rgba(212,144,122,.16), rgba(212,144,122,.05));
  box-shadow: inset 0 1px 0 rgba(237,241,255,.06);
}

/* En-têtes de section : filet qui prolonge le titre */
.sec-header { position: relative; }
.sec-header::after {
  content: '';
  flex: 1;
  height: 1px;
  margin-left: 4px;
  background: linear-gradient(90deg, var(--bord2), transparent);
}
.sec-bar { box-shadow: 0 0 10px rgba(212,144,122,.45); }

/* Navigation : halo doux sur l'onglet actif */
.nav-btn.active .nav-ic {
  filter: drop-shadow(0 0 9px rgba(212,144,122,.55));
  transform: translateY(-1px);
}
.nav-btn.active::before { box-shadow: 0 0 12px rgba(212,144,122,.7); }
.nav-btn.active .nav-lbl { letter-spacing: .07em; }

/* Boutons : lumière sur le bord supérieur */
.btn-primary {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 20px -8px rgba(212,144,122,.55);
}
.btn-secondary, .btn-blue, .btn-ghost {
  box-shadow: inset 0 1px 0 rgba(237,241,255,.05);
}

/* Puces de filtre : relief à l'état actif */
.chip.active {
  background-image: linear-gradient(160deg, rgba(212,144,122,.2), rgba(212,144,122,.07));
  box-shadow: inset 0 1px 0 rgba(237,241,255,.08), 0 2px 10px -4px rgba(212,144,122,.4);
}

/* Barre de tête : dégradé de fondu sous la barre */
#topbar::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -18px; height: 18px;
  background: linear-gradient(180deg, rgba(2,4,12,.85), transparent);
  pointer-events: none;
}

/* ══ HEATMAP DES SCORES (élément signature) ══ */
.heat-wrap { margin-top: 4px; }
.heat-grid {
  display: grid;
  grid-template-columns: 26px repeat(5, 1fr);
  gap: 3px;
}
.heat-cell {
  aspect-ratio: 1 / 1;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fm);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--bord);
  position: relative;
  transition: transform .12s ease;
}
.heat-cell.peak {
  border-color: var(--acc);
  box-shadow: 0 0 0 1px var(--accB), 0 0 14px -2px rgba(212,144,122,.5);
  z-index: 1;
}
.heat-axis {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fm);
  font-size: 9px;
  color: var(--w30);
}
.heat-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 9px;
  font-size: 9px;
  color: var(--w30);
  letter-spacing: .04em;
}
.heat-scale {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, rgba(212,144,122,.06), var(--acc));
}

/* ══ LIGNES DE NAVIGATION (menu) ══ */
.nav-group { margin-bottom: 18px; }
.nav-group-title {
  font-family: var(--ft);
  font-size: 10px;
  letter-spacing: .22em;
  color: var(--w30);
  margin: 0 2px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-group-title::after {
  content: '';
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--bord2), transparent);
}
.nav-list {
  background: var(--card);
  border: 1px solid var(--bord);
  border-radius: var(--r4);
  overflow: hidden;
  background-image: linear-gradient(178deg, rgba(237,241,255,.035) 0%, rgba(237,241,255,0) 42%);
}
.nav-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--bord);
  cursor: pointer;
  transition: background .13s ease, transform .1s ease;
}
.nav-row:last-child { border-bottom: none; }
.nav-row:active { background: var(--w03); transform: scale(.99); }
.nav-row-ic {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
  background: var(--w06);
  border: 1px solid var(--bord);
}
.nav-row-txt { flex: 1; min-width: 0; }
.nav-row-t {
  font-family: var(--fb);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--w);
  margin-bottom: 1px;
}
.nav-row-s {
  font-size: 11px;
  color: var(--w30);
  line-height: 1.35;
}
.nav-row-arrow { color: var(--w12); font-size: 15px; flex-shrink: 0; }
.nav-row-tag {
  font-family: var(--fb);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .05em;
  padding: 3px 7px;
  border-radius: 5px;
  flex-shrink: 0;
}

/* ══ EN-TÊTE DE PAGE ══ */
.page-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0 14px;
}
.page-back {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: var(--w03);
  border: 1px solid var(--bord);
  display: flex; align-items: center; justify-content: center;
  color: var(--w55);
  font-size: 17px;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform .1s ease, border-color .15s ease;
}
.page-back:active { transform: scale(.92); border-color: var(--accB); }
.page-head-t {
  font-family: var(--ft);
  font-size: 21px;
  letter-spacing: .05em;
  color: var(--w);
  line-height: 1;
}
.page-head-s { font-size: 11px; color: var(--w30); margin-top: 2px; }

/* ══ CLASSES HÉRITÉES — alignées sur le design system v3 ══ */

/* États vides */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:44px 20px; text-align:center; }
.empty-ic, .ei { font-size:34px; margin-bottom:12px; }
.empty-t, .et { font-family:var(--ft); font-size:16px; letter-spacing:.09em; color:var(--w55); margin-bottom:7px; }
.empty-s, .es { font-size:12px; color:var(--w30); line-height:1.6; max-width:300px; }

/* Cartes colorées */
.card-bleu, .card-rouge, .card-vert {
  border-radius: var(--r4); padding:14px; border:1px solid var(--bord);
  background-image: linear-gradient(178deg, rgba(237,241,255,.035) 0%, rgba(237,241,255,0) 42%);
}
.card-bleu  { background-color: var(--card); border-color: var(--blB);  box-shadow: inset 0 1px 0 rgba(59,138,255,.10); }
.card-rouge { background-color: var(--card); border-color: rgba(224,48,80,.28); box-shadow: inset 0 1px 0 rgba(224,48,80,.10); }
.card-vert  { background-color: var(--card); border-color: rgba(0,196,122,.28); box-shadow: inset 0 1px 0 rgba(0,196,122,.10); }

/* Libellés et champs */
.clbl { font-family:var(--ft); font-size:11px; letter-spacing:.2em; color:var(--w30); margin-bottom:9px; text-transform:uppercase; }
.fl   { font-size:10px; letter-spacing:.1em; color:var(--w30); margin-bottom:5px; text-transform:uppercase; }
.fw   { width:100%; }
.g2   { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* Blocs statistiques */
.sbox { background:var(--card2); border:1px solid var(--bord); border-radius:var(--r3); padding:12px 8px; text-align:center; }
.sv   { font-family:var(--ft); font-size:21px; line-height:1; color:var(--w); margin-bottom:4px; }
.sl   { font-size:9px; letter-spacing:.08em; color:var(--w30); text-transform:uppercase; }

/* Tableaux (comparateur, cotes) */
.tbl { width:100%; border-collapse:collapse; font-family:var(--fb); }
.tbl td, .tbl th { padding:8px 6px; border-bottom:1px solid var(--bord); font-size:12px; color:var(--w55); }

.oc.best { color:var(--acc); font-weight:600; background:var(--accL2); border-radius:5px; }
.bkn { font-size:12px; color:var(--w80); font-weight:600; }
.pinb { display:inline-block; margin-left:5px; padding:2px 5px; border-radius:4px; background:var(--blL); color:var(--bl2); font-size:8px; font-weight:700; letter-spacing:.06em; vertical-align:middle; }

/* Chat */

}

.chat-bubble {

}
.chat-msg-user .chat-bubble { background:var(--accL2); border-color:var(--accB); color:var(--w); }
.cbtn {
  padding:7px 13px; border-radius:20px; border:1px solid var(--bord);
  background:var(--w03); color:var(--w55); font-family:var(--fb); font-size:11px;
  cursor:pointer; white-space:nowrap; transition:all .15s;
}
.cbtn:active { transform:scale(.94); border-color:var(--accB); color:var(--acc); }

/* Fenêtres modales */
.ovl { position:fixed; inset:0; background:rgba(0,0,0,.62); backdrop-filter:blur(4px); z-index:400; display:flex; align-items:flex-end; justify-content:center; }

  flex:1; padding:11px; border-radius:var(--r2); border:1px solid var(--bord);

}
.mbtn.gold { background:linear-gradient(135deg,var(--acc),#B87060); border:none; color:#02040C; }

/* Carte match héritée */

.mc-team-a { text-align:right; }

.mc-analyse-btn {

  background:var(--accL2); border:1px solid var(--accB); color:var(--acc);

/* Lignes de section */

function addManualBet(){
  var match=document.getElementById('bet-match');
  var label=document.getElementById('bet-label');
  var stake=document.getElementById('bet-stake');
  var odd=document.getElementById('bet-odd');
  if(!match||!stake||!odd)return;
  var matchV=(match.value||'').trim();
  var stakeV=parseFloat(stake.value);
  var oddV=parseFloat(odd.value);
  if(!matchV||!stakeV||stakeV<=0||!oddV||oddV<1.01){alert('Remplis tous les champs.');return;}
  var entry={id:Date.now(),match:matchV,bet:label?label.value.trim():'',stake:stakeV,odd:oddV,date:new Date().toLocaleDateString('fr-FR'),status:'pending',result:null,profit:null};
  S.hist=S.hist||[];S.hist.unshift(entry);
  try{localStorage.setItem('edge_hist',JSON.stringify(S.hist));}catch(e){}
  match.value='';if(label)label.value='';stake.value='';odd.value='';
  renderPage();
}
function settlebet(pendingIdx,result){
  var pending=(S.hist||[]).filter(function(e){return e.status==='pending';});
  var entry=pending[pendingIdx];
  if(!entry)return;
  var globalIdx=S.hist.indexOf(entry);
  if(globalIdx<0)return;
  S.hist[globalIdx].status='settled';
  S.hist[globalIdx].result=result;
  S.hist[globalIdx].profit=result==='WIN'?+(entry.stake*(entry.odd-1)).toFixed(2):-Math.abs(entry.stake);
  var totalProfit=(S.hist||[]).filter(function(e){return e.status==='settled';}).reduce(function(a,e){return a+(+e.profit||0);},0);
  var bkStart=+(localStorage.getItem('edge_bk_start')||1000);
  S.bk=+(bkStart+totalProfit).toFixed(2);
  try{localStorage.setItem('edge_hist',JSON.stringify(S.hist));localStorage.setItem('edge_bk',String(S.bk));}catch(e){}
  renderPage();
}
function quickAddBet(){

function runBacktest(){
  var dEl=document.getElementById("bt-days"), lEl=document.getElementById("bt-league");
  S.btDays=dEl?parseInt(dEl.value):7;
  S.btLeague=lEl?lEl.value:"";
  S.btLoad=true; S.btErr=null; S.btRes=null;
  renderPage();
  var url="/api/backtest?days="+S.btDays+(S.btLeague?"&leagueId="+S.btLeague:"");
  fetch(url).then(function(r){return r.json();}).then(function(d){
    S.btLoad=false;
    if(!d||d.error){S.btErr="Erreur : "+((d&&d.error)||"réponse vide");renderPage();return;}
    var ms=d.matches||[];
    if(!ms.length){S.btErr="Aucun match terminé avec cotes sur cette période. Essaie une période plus longue ou toutes les compétitions.";renderPage();return;}

    var MKDEF=[
      {k:"1",label:"Victoire domicile",f:function(m){return m.realResult==="1";}},
      {k:"N",label:"Match nul",f:function(m){return m.realResult==="N";}},
      {k:"2",label:"Victoire extérieur",f:function(m){return m.realResult==="2";}},
      {k:"1X",label:"Double chance 1X",f:function(m){return m.realResult!=="2";}},
      {k:"X2",label:"Double chance X2",f:function(m){return m.realResult!=="1";}},
      {k:"O25",label:"Plus de 2,5 buts",f:function(m){return m.totalGoals>2.5;}},
      {k:"U25",label:"Moins de 2,5 buts",f:function(m){return m.totalGoals<2.5;}},
      {k:"O15",label:"Plus de 1,5 but",f:function(m){return m.totalGoals>1.5;}},
      {k:"O35",label:"Plus de 3,5 buts",f:function(m){return m.totalGoals>3.5;}},
      {k:"BY",label:"Les 2 marquent",f:function(m){return !!m.btts;}},
      {k:"BN",label:"Une équipe blanchie",f:function(m){return !m.btts;}}
    ];
    var mkStats={}; MKDEF.forEach(function(x){mkStats[x.k]={sum:0,n:0,w:0,label:x.label};});
    var strat={best:{n:0,w:0,pnl:0},only3:{n:0,w:0,pnl:0},fav:{n:0,w:0,pnl:0},line:{n:0,w:0,pnl:0}};
    var sample=[], accMktW=0, accMktN=0;

    ms.forEach(function(m){
      var r; try{r=calc(m);}catch(e){return;}
      if(!r)return;
      var P={"1":r.pH,"N":r.pN,"2":r.pA,"1X":r.p1X,"X2":r.p2X,
        "O25":r.pOver25,"U25":r.pUnder25,"O15":(r.pUnder15!==undefined?1-r.pUnder15:undefined),
        "O35":r.pOver35,"BY":r.pBttsY,"BN":r.pBttsN};
      MKDEF.forEach(function(x){
        var p=P[x.k];
        if(p===undefined||!isFinite(p))return;
        var st=mkStats[x.k]; st.n++; st.sum+=p; if(x.f(m))st.w++;
      });
      // Référence marché : favori des cotes
      var fav=(m.o1<m.on&&m.o1<m.o2)?"1":((m.o2<m.o1&&m.o2<m.on)?"2":"N");
      accMktN++; if(fav===m.realResult)accMktW++;
      var fo={"1":m.o1,"N":m.on,"2":m.o2}[fav];
      strat.fav.n++; if(fav===m.realResult){strat.fav.pnl+=fo-1;strat.fav.w++;}else strat.fav.pnl-=1;
      // 1X2 le plus probable
      var b3=r.bR, o3={"1":m.o1,"N":m.on,"2":m.o2}[b3];
      strat.only3.n++; if(b3===m.realResult){strat.only3.pnl+=o3-1;strat.only3.w++;}else strat.only3.pnl-=1;
      // Meilleur pari tous marchés
      var bb=bestBets(m,r);
      if(bb.length){
        var b0=bb[0];
        var def=null; MKDEF.forEach(function(x){if(x.k===b0.k)def=x;});
        var won=def?def.f(m):false;
        strat.best.n++; if(won){strat.best.pnl+=b0.odd-1;strat.best.w++;}else strat.best.pnl-=1;
        if(sample.length<12) sample.push({h:m.h,a:m.a,gh:m.goalsH,ga:m.goalsA,bet:b0.label,prob:Math.round(b0.prob*100),odd:b0.odd,won:won});
      }
      // Value de prix (line shopping)
      if(m.lineValue&&m.lineValue.edge>=0.04){
        var lk=m.lineValue.pick;
        strat.line.n++;
        if(lk===m.realResult){strat.line.pnl+=m.lineValue.odd-1;strat.line.w++;}else strat.line.pnl-=1;
      }
    });

    // ── Fiabilité par tranche de confiance : "quand on annonce X%, ça arrive Y%" ──
    var bands=[[0.45,0.55],[0.55,0.65],[0.65,0.75],[0.75,0.85],[0.85,1.01]];
    var bandStats=bands.map(function(b){return {lo:b[0],hi:b[1],n:0,w:0,sum:0};});
    ms.forEach(function(m){
      var r;try{r=calc(m);}catch(e){return;}
      if(!r)return;
      var bb;try{bb=bestBets(m,r);}catch(e){return;}
      if(!bb||!bb.length)return;
      var b=bb[0], tot=m.totalGoals, bt=!!m.btts, res=m.realResult, won;
      switch(b.k){
        case "1":won=res==="1";break; case "N":won=res==="N";break; case "2":won=res==="2";break;
        case "1X":won=res!=="2";break; case "X2":won=res!=="1";break; case "12":won=res!=="N";break;
        case "O15":won=tot>1.5;break; case "O25":won=tot>2.5;break; case "U25":won=tot<2.5;break;
        case "O35":won=tot>3.5;break; case "BY":won=bt;break; case "BN":won=!bt;break; default:won=false;
      }
      for(var i=0;i<bandStats.length;i++){
        if(b.prob>=bandStats[i].lo&&b.prob<bandStats[i].hi){
          bandStats[i].n++; bandStats[i].sum+=b.prob; if(won)bandStats[i].w++;
          break;
        }
      }
    });
    var confBands=bandStats.filter(function(b){return b.n>=5;}).map(function(b){
      return {label:Math.round(b.lo*100)+"–"+Math.round(b.hi*100)+"%",
        n:b.n, pred:b.sum/b.n*100, real:b.w/b.n*100, gap:(b.w/b.n*100)-(b.sum/b.n*100)};
    });

    var markets=[];
    MKDEF.forEach(function(x){
      var st=mkStats[x.k];
      if(st.n<10)return;
      var pred=st.sum/st.n*100, real=st.w/st.n*100;
      markets.push({label:st.label,pred:pred,real:real,gap:real-pred,n:st.n});
    });
    markets.sort(function(a,b){return Math.abs(a.gap)-Math.abs(b.gap);});

    function pack(name,s){return {name:name,n:s.n,acc:s.n?s.w/s.n*100:0,roi:s.n?s.pnl/s.n*100:0};}
    S.btRes={
      n:ms.length,
      accBest:strat.best.n?strat.best.w/strat.best.n*100:0,
      roiBest:strat.best.n?strat.best.pnl/strat.best.n*100:0,
      accMkt:accMktN?accMktW/accMktN*100:0,
      strats:[
        pack("Meilleur pari (tous marchés)",strat.best),
        pack("1X2 le plus probable",strat.only3),
        pack("Favori des bookmakers",strat.fav),
        pack("Meilleur prix (edge ≥4%)",strat.line)
      ],
      markets:markets,
      confBands:confBands,
      sample:sample
    };
    renderPage();
  }).catch(function(e){
    S.btLoad=false;S.btErr="Connexion impossible : "+(e&&e.message?e.message:"erreur réseau");renderPage();
  });
}

function callAI(prompt,max,retries){
  max=max||2000;retries=retries||0;
  var controller=typeof AbortController!=="undefined"?new AbortController():null;
  var tid=controller?setTimeout(function(){controller.abort();},28000):null;
  return fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({messages:[{role:"user",content:prompt}],
  system:"Tu es EDGE, expert en analyse de paris sportifs. Tu analyses les matchs avec rigueur : probabilites, value bets, gestion du risque. Sois direct, humain, sans jargon technique. Donne toujours un avis clair et une recommandation concrete. 18+ — tu rappelles toujours de parier responsablement.",
  max_tokens:max}),signal:controller?controller.signal:undefined})
  .then(function(r){if(tid)clearTimeout(tid);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(function(data){if(data.error)throw new Error(data.error);return data.text||data.content||"";})
  .catch(function(e){if(tid)clearTimeout(tid);if(retries<1&&(e.name==="AbortError"||String(e.message).indexOf("HTTP")>=0))return callAI(prompt,max,1);throw e;});
}

function explainProno(edg,bO,m,bR){
  var reasons=[],risks=[];
  if(edg>0.08)reasons.push("Edge exceptionnel +"+((edg)*100).toFixed(1)+"% - rare opportunite");
  else if(edg>0.05)reasons.push("Edge solide +"+((edg)*100).toFixed(1)+"% - value confirmee");
  else if(edg>0.03)reasons.push("Edge positif +"+((edg)*100).toFixed(1)+"% - legere value");
  else risks.push("Edge faible - pari a eviter");
  if(m.derby)risks.push("Derby - resultat impredictible");
  if(m.hf&&bR==="1"){if(m.hf>=12)reasons.push("Bonne forme domicile ("+m.hf+"/15 pts)");else if(m.hf<=5)risks.push("Mauvaise forme domicile");}
  if(m.af&&bR==="2"){if(m.af>=12)reasons.push("Bonne forme exterieur");else if(m.af<=5)risks.push("Mauvaise forme exterieur");}
  if(m.o1&&m.on&&m.o2){var mg=(1/m.o1+1/m.on+1/m.o2-1)*100;if(mg<3)reasons.push("Marche liquide - cotes fiables");else if(mg>8)risks.push("Marge elevee ("+mg.toFixed(1)+"%) - cotes moins fiables");}
  if(bO>=1.50)reasons.push("Cote correcte @ "+bO.toFixed(2)+" - bon rapport risque/gain");
  else if(bO<1.30)risks.push("Cote tres basse @ "+bO.toFixed(2)+" - mise reduite");
  return{reasons:reasons,risks:risks};
}

function generateSentiment(r,d){
  if(!r||!d)return null;
  var pH=r.pH||0.33,pA=r.pA||0.33;
  var edg=r.edg||0;
  var hf=d.hF||8,af=d.aF||6;
  var motivH=d.motivH||0,motivA=d.motivA||0;
  var buzzH=Math.round(Math.min(95,Math.max(20,
  50 + pH*30 + (hf/15)*15 + motivH*5
  )));
  var buzzA=Math.round(Math.min(95,Math.max(20,
  50 + pA*25 + (af/15)*10 + motivA*5
  )));
  var labelH=buzzH>75?"En feu - Supporters optimistes":
  buzzH>60?"Confiance dans le groupe":
  buzzH>45?"Atmosph re mitig e":
  "Pression et inqui tude";
  var labelA=buzzA>70?"D termin s et motiv s":
  buzzA>55?"Groupe soud ":
  buzzA>40?"Match difficile attendu":
  "Peu d\'espoir des supporters";
  var moralH=motivH>1?"Excellente dynamique":
  motivH>0?"Bonne dynamique":
  motivH<-1?"Moral en berne":
  "Stable";
  var moralA=motivA>1?"Surprenante r gularit ":
  motivA>0?"Mont e en puissance":
  motivA<-1?"Groupe sous pression":
  "Stable";
  var engouement=Math.round(
  (buzzH+buzzA)/2
  +(d.derby?15:0)
  +(d.stakeLevel>=2?10:0)
  +((d.hRank<=4||d.aRank<=4)?8:0)
  );
  engouement=Math.min(99,Math.max(20,engouement));
  return{buzzH,buzzA,labelH,labelA,moralH,moralA,engouement};
}

function monteCarlo(lH, lA, N){
  N = N || 800;
  var counts = {}, mcH=0, mcN=0, mcA=0;
  function rp(l){
    var L=Math.exp(-l),k=0,p=1;
    do{k++;p*=Math.random();}while(p>L&&k<15);
    return k-1;
  }
  for(var i=0;i<N;i++){
    var gh=rp(lH), ga=rp(lA);
    var key=gh+"-"+ga;
    counts[key]=(counts[key]||0)+1;
    if(gh>ga) mcH++; else if(gh===ga) mcN++; else mcA++;
  }
  var scores=[];
  Object.keys(counts).forEach(function(k){
    var parts=k.split("-");
    scores.push({h:+parts[0],a:+parts[1],pct:Math.round(counts[k]/N*1000)/10});
  });
  scores.sort(function(a,b){return b.pct-a.pct;});
  // Grille de distribution 5x5 (0 à 4+ buts par équipe)
  var grid=[], maxPct=0;
  for(var gh=0; gh<5; gh++){
    var row=[];
    for(var ga=0; ga<5; ga++){
      var c=0;
      Object.keys(counts).forEach(function(k){
        var pr=k.split("-"), kh=+pr[0], ka=+pr[1];
        var rh=Math.min(kh,4), ra=Math.min(ka,4);
        if(rh===gh&&ra===ga) c+=counts[k];
      });
      var pct=Math.round(c/N*1000)/10;
      if(pct>maxPct) maxPct=pct;
      row.push(pct);
    }
    grid.push(row);
  }
  return {
    pH: Math.round(mcH/N*100)/100,
    pN: Math.round(mcN/N*100)/100,
    pA: Math.round(mcA/N*100)/100,
    scores: scores.slice(0,6),
    grid: grid,
    maxPct: maxPct,
    N: N
  };
}

function generateReason(m, r){
  if(!m||!r) return {reasons:[]};
  var reasons=[];
  var bR=r.bR;
  var isHome=bR==="1"||bR==="1X";
  var isAway=bR==="2"||bR==="2X";
  var team=isHome?(m.h||m.home||"l\u2019\u00e9quipe \u00e0 domicile"):isAway?(m.a||m.away||"l\u2019\u00e9quipe ext\u00e9rieure"):null;

  // Probabilit\u00e9 dominante
  var pMax=Math.max(r.pH||0,r.pN||0,r.pA||0);
  if(pMax>=0.55&&team) reasons.push(team+" a "+Math.round(pMax*100)+"% de probabilit\u00e9 selon notre mod\u00e8le Dixon-Coles.");
  else if(pMax>=0.45&&team) reasons.push("L\u00e9ger avantage pour "+team+" ("+Math.round(pMax*100)+"% de probabilit\u00e9 calcul\u00e9e).");

  // xG
  var hxg=m.hxg||0, axg=m.axg||0;
  if(isHome&&hxg>axg*1.3) reasons.push("Attaque nettement sup\u00e9rieure : "+hxg.toFixed(2)+" xG/match contre "+axg.toFixed(2)+".");
  if(isAway&&axg>hxg*1.3) reasons.push("Attaque ext\u00e9rieure dominante : "+axg.toFixed(2)+" xG/match contre "+hxg.toFixed(2)+".");

  // Forme
  if(isHome&&(m.hFormScore||0)>(m.aFormScore||0)+0.2) reasons.push("Meilleure forme r\u00e9cente (score forme "+Math.round((m.hFormScore||0)*100)+" vs "+Math.round((m.aFormScore||0)*100)+").");
  if(isAway&&(m.aFormScore||0)>(m.hFormScore||0)+0.2) reasons.push("Meilleure dynamique r\u00e9cente malgr\u00e9 le d\u00e9placement.");

  // Edge / value
  var edg=(r.edg_best||r.edg||0);
  if(edg>=0.04&&m.hasRealOdds) reasons.push("Value bet d\u00e9tect\u00e9 : +"+(edg*100).toFixed(1)+"% d\u2019\u00e9cart entre notre probabilit\u00e9 et la cote du march\u00e9.");
  if(r.hasPinnacle) reasons.push("Cotes valid\u00e9es contre Pinnacle (bookmaker de r\u00e9f\u00e9rence sharp).");

  // Confiance
  if((r.conf||0)>=75) reasons.push("Confiance \u00e9lev\u00e9e du moteur : "+r.conf+"% (convergence de tous les indicateurs).");

  // Monte Carlo
  if(r.mcH!==undefined&&isHome&&r.mcH>0.5) reasons.push("Confirm\u00e9 par simulation Monte Carlo : victoire dans "+Math.round(r.mcH*100)+"% des 800 sc\u00e9narios simul\u00e9s.");
  if(r.mcA!==undefined&&isAway&&r.mcA>0.5) reasons.push("Confirm\u00e9 par Monte Carlo : "+Math.round(r.mcA*100)+"% des simulations.");

  return {reasons:reasons.slice(0,5)};
}

function kellyFull(prob, cote, bankroll, fraction){
  fraction=fraction||0.25;
  if(!prob||!cote||!bankroll||cote<=1) return 0;
  var p=prob>1?prob/100:prob;
  var b=cote-1;
  var k=(p*b-(1-p))/b;
  if(k<=0) return 0;
  return Math.round(k*fraction*bankroll*100)/100;
}

function recordSignals(){
  if(!S.track)loadTrack();
  var now=Date.now();
  (S.matches||[]).forEach(function(m){
    if(!m.e||!m.id)return;
    var r=m.e;
    // Signal fort = proba du pick >= 55% (calibré: ~75% de réussite attendue)
    // ou vrai value bet (edge >=4% avec données indépendantes)
    var _pv={1:r.pH||0,N:r.pN||0,2:r.pA||0};
    var _pPick=_pv[r.bR]||0;
    // Sans vraies cotes, le moteur ne fait que recopier des valeurs par défaut → aucun signal
    if(!m.hasRealOdds)return;
    var strong=(_pPick>=0.55)||!!(m.lineValue&&m.lineValue.edge>=0.04);
    if(!strong)return;
    if(isLive(m.time||m.t,m.status)||isDone(m.time||m.t))return;
    for(var i=0;i<S.track.length;i++){if(S.track[i].id===m.id)return;}
    // On enregistre le pari que l'app recommande réellement (tous marchés)
    var pick=r.bR, cote=0, betLabel=null, betKey=null;
    try{
      var _bb=bestBets(m,r);
      if(_bb&&_bb.length){betKey=_bb[0].k;betLabel=_bb[0].label;cote=_bb[0].odd;_pPick=_bb[0].prob;}
      // Si un meilleur prix existe sur ce pick, c'est LUI qu'on enregistre
      if(m.lineValue&&m.lineValue.pick===betKey&&m.lineValue.odd>cote){cote=m.lineValue.odd;}
    }catch(e){}
    if(!betKey){
      if(pick!=="1"&&pick!=="N"&&pick!=="2")return;
      betKey=pick;betLabel=null;
      cote=pick==="1"?(m.o1||0):pick==="2"?(m.o2||0):(m.on||0);
    }
    pick=betKey;
    if(!cote||cote<1.01)return;
    S.track.push({id:m.id,ts:now,date:(m.time||m.t||"").slice(0,10),
      h:m.h||m.home||"",a:m.a||m.away||"",lg:m.c||m.leagueName||"",
      pick:pick,label:betLabel,cote:cote,
      refOdd:(m.lineValue&&m.lineValue.pick===pick&&m.lineValue.odd>0)?({"1":m.o1,"N":m.on,"2":m.o2}[pick]||null):null,
      book:(m.lineValue&&m.lineValue.pick===pick)?(m.lineValue.book||null):null,
      conf:r.conf||0,proba:Math.round(_pPick*100),edge:Math.round((r.edg_best||0)*1000)/10,
      status:"pending"});
  });
  saveTrack();
}
function settleTrack(finished){
  if(!S.track)loadTrack();
  var changed=false;
  if(finished&&finished.length){
    S.track.forEach(function(t){
      if(t.status!=="pending")return;
      var f=null;
      for(var i=0;i<finished.length;i++){if(finished[i].id===t.id){f=finished[i];break;}}
      if(!f||f.gh===null||f.gh===undefined||f.ga===null||f.ga===undefined)return;
      var gh=f.gh, ga=f.ga, tot=gh+ga, res=gh>ga?"1":gh<ga?"2":"N";
      var bt=(gh>0&&ga>0);
      var won;
      switch(t.pick){
        case "1":  won=(res==="1"); break;
        case "N":  won=(res==="N"); break;
        case "2":  won=(res==="2"); break;
        case "1X": won=(res!=="2"); break;
        case "X2": won=(res!=="1"); break;
        case "12": won=(res!=="N"); break;
        case "O15":won=(tot>1.5); break;
        case "O25":won=(tot>2.5); break;
        case "U25":won=(tot<2.5); break;
        case "O35":won=(tot>3.5); break;
        case "BY": won=bt; break;
        case "BN": won=!bt; break;
        default:   won=(res===t.pick);
      }
      t.status=won?"won":"lost";
      t.gh=gh;t.ga=ga;
      changed=true;
    });
  }
  var cutoff=Date.now()-4*86400000;
  S.track.forEach(function(t){if(t.status==="pending"&&t.ts<cutoff){t.status="void";changed=true;}});
  if(changed)saveTrack();
}
function trackStats(){
  if(!S.track)loadTrack();
  var settled=S.track.filter(function(t){return t.status==="won"||t.status==="lost";});
  var won=settled.filter(function(t){return t.status==="won";});
  var pnl=0;
  settled.forEach(function(t){pnl+=(t.status==="won")?(t.cote-1):-1;});
  return {
    n:S.track.length,
    settled:settled.length,
    won:won.length,
    winRate:settled.length?Math.round(won.length/settled.length*100):0,
    pnl:Math.round(pnl*100)/100,
    roi:settled.length?Math.round(pnl/settled.length*1000)/10:0,
    pending:S.track.filter(function(t){return t.status==="pending";}).length,
    since:S.track.length?S.track[0].date:null
  };
}

function notifStatus(){
  if(typeof Notification==="undefined")return "unsupported";
  return Notification.permission; // "default" | "granted" | "denied"
}
function initNotifs(cb){
  if(typeof Notification==="undefined"){if(cb)cb("unsupported");return;}
  if(Notification.permission==="granted"){S.notifOn=true;try{localStorage.setItem("edge_notif","1");}catch(e){}if(cb)cb("granted");return;}
  Notification.requestPermission().then(function(p){
    S.notifOn=(p==="granted");
    try{localStorage.setItem("edge_notif",S.notifOn?"1":"0");}catch(e){}
    if(cb)cb(p);
    renderPage();
  }).catch(function(){if(cb)cb("error");});
}
function sendNotif(title, body, tag){
  try{
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return false;
    var opts={body:body,tag:tag||"edge",icon:"/icon-192.png",badge:"/icon-192.png",vibrate:[80,40,80],data:{url:"/"}};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        if(reg&&reg.showNotification)reg.showNotification(title,opts);
        else new Notification(title,opts);
      }).catch(function(){try{new Notification(title,opts);}catch(e){}});
    } else {
      new Notification(title,opts);
    }
    return true;
  }catch(e){return false;}
}
function checkNewSignals(){
  // Notifie UNE FOIS chaque nouveau signal fort / value bet détecté
  if(!S.notifOn)return;
  var seen;
  try{seen=JSON.parse(localStorage.getItem("edge_notified")||"[]");}catch(e){seen=[];}
  var changed=false;
  (S.matches||[]).forEach(function(m){
    if(!m.e||!m.id)return;
    if(seen.indexOf(m.id)>=0)return;
    if(isLive(m.time||m.t,m.status)||isDone(m.time||m.t))return;
    var r=m.e;
    var pv={1:r.pH||0,N:r.pN||0,2:r.pA||0};
    var pPick=pv[r.bR]||0;
    if(!m.hasRealOdds)return;
    var isStrong=pPick>=0.55;
    var isValue=!!(m.lineValue&&m.lineValue.edge>=0.04);
    if(!isStrong&&!isValue)return;
    var pickLbl=r.bR==="1"?(m.h||m.home):r.bR==="2"?(m.a||m.away):"Match nul";
    var cote=r.bR==="1"?m.o1:r.bR==="2"?m.o2:m.on;
    var heure=fmtTime(m.time||m.t);
    var title=isValue?"💎 Value bet détecté":"⚡ Signal fort EDGE";
    var body=(m.h||m.home)+" vs "+(m.a||m.away)+" ("+heure+")\n"+
      "→ "+pickLbl+" @"+cote+" · "+Math.round(pPick*100)+"% proba"+
      (isValue?" · +"+Math.round((r.edg_best||0)*1000)/10+"% edge":"");
    if(sendNotif(title,body,"edge-"+m.id)){
      seen.push(m.id);
      changed=true;
    }
  });
  if(changed){
    try{localStorage.setItem("edge_notified",JSON.stringify(seen.slice(-200)));}catch(e){}
  }
}

function toggleNotifs(){
  if(S.notifOn){
    S.notifOn=false;
    try{localStorage.setItem("edge_notif","0");}catch(e){}
    renderPage();
  } else {
    initNotifs();
  }
}

// Count-up animé des chiffres (stat-val avec data-count)
function animateNumbers(){
  try{
    var els=document.querySelectorAll("[data-count]");
    for(var i=0;i<els.length;i++){
      (function(el){
        var target=parseFloat(el.getAttribute("data-count"));
        if(isNaN(target))return;
        var suffix=el.getAttribute("data-suffix")||"";
        var prefix=el.getAttribute("data-prefix")||"";
        var dec=(el.getAttribute("data-count").indexOf(".")>=0)?1:0;
        var dur=650, t0=null;
        function step(ts){
          if(!t0)t0=ts;
          var p=Math.min((ts-t0)/dur,1);
          var ease=1-Math.pow(1-p,3);
          el.textContent=prefix+(target*ease).toFixed(dec)+suffix;
          if(p<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })(els[i]);
    }
  }catch(e){}
}

// Applique les vraies stats de l'API d'enrichissement → dataQ monte, edge devient crédible
function applyEnrich(m, data){
  if(!m||!data) return;
  try{
    var hs = data.homeStats || data.home || null;
    var as = data.awayStats || data.away || null;
    function pts(form){
      if(!form||!form.length) return null;
      var p=0, arr=(typeof form==="string")?form.split(""):form;
      arr.forEach(function(x){ if(x==="W")p+=3; else if(x==="D")p+=1; });
      return p;
    }
    if(hs){
      if(hs.avgGoalsFor)  m.hg  = +hs.avgGoalsFor;
      if(hs.avgGoalsAga)  m.hxga= +hs.avgGoalsAga;
      if(hs.xg)           m.hxg = +hs.xg;
      if(hs.xga)          m.hxga= +hs.xga;
      var hp=pts(hs.form); if(hp!==null) m.hf=hp;
      if(hs.form)         m.hForm = (typeof hs.form==="string")?hs.form:hs.form.join("");
      if(hs.cleanSheets&&hs.played) m.hcs=Math.round(hs.cleanSheets/hs.played*100);
      if(hs.winRate)      m.hWinRate=+hs.winRate;
      if(hs.played)       m.hMatchesPlayed=+hs.played;
      if(hs.rank)         m.hRank=+hs.rank;
    }
    if(as){
      if(as.avgGoalsFor)  m.ag  = +as.avgGoalsFor;
      if(as.avgGoalsAga)  m.axga= +as.avgGoalsAga;
      if(as.xg)           m.axg = +as.xg;
      if(as.xga)          m.axga= +as.xga;
      var ap=pts(as.form); if(ap!==null) m.af=ap;
      if(as.form)         m.aForm = (typeof as.form==="string")?as.form:as.form.join("");
      if(as.cleanSheets&&as.played) m.acs=Math.round(as.cleanSheets/as.played*100);
      if(as.winRate)      m.aWinRate=+as.winRate;
      if(as.played)       m.aMatchesPlayed=+as.played;
      if(as.rank)         m.aRank=+as.rank;
    }
    if(data.h2h&&data.h2h.length){
      m.h2h = data.h2h;
      var tot=data.h2h.length, hw=0, dr=0, aw=0;
      data.h2h.forEach(function(g){
        var gh=(g.goalsH!==undefined)?g.goalsH:g.gh, ga=(g.goalsA!==undefined)?g.goalsA:g.ga;
        if(gh===undefined||ga===undefined)return;
        if(gh>ga)hw++; else if(gh<ga)aw++; else dr++;
      });
      m.h2hStats={total:tot,hWins:hw,draws:dr,aWins:aw,homeWins:hw,awayWins:aw};
    }
    if(data.pinnacle) m.pinnacle=data.pinnacle;
    if(data.injuries&&data.injuries.length) m.injuries=data.injuries;
    if(data.lineups&&data.lineups.length) m.lineups=data.lineups;

    // Données indépendantes du marché → l'edge devient crédible
    m._enriched=true;
    m.dataQuality="real";

    try{ m.e=calc(m); }catch(e){}
    if(S.selM&&S.selM.id===m.id){
      S.selM=m;
      try{ S.res=m.e; }catch(e){}
      try{ renderPage(); }catch(e){}
    }
  }catch(e){}
}

// ═══ ENRICHISSEMENT AUTOMATIQUE EN ARRIÈRE-PLAN ═══
// Sans ça, les signaux de la liste ne seraient qu'un écho des cotes du marché.
// On charge les vraies stats des matchs les plus proches, en douceur (quota API).
function loadEnrichCache(){
  try{
    var raw=localStorage.getItem("edge_enrich");
    if(!raw)return;
    var obj=JSON.parse(raw), now=Date.now(), kept={};
    Object.keys(obj).forEach(function(k){
      if(obj[k]&&obj[k].ts&&now-obj[k].ts<12*3600000) kept[k]=obj[k];
    });
    S._enrichCache=kept;
  }catch(e){S._enrichCache={};}
}
function saveEnrichCache(){
  try{
    var c=S._enrichCache||{}, keys=Object.keys(c);
    if(keys.length>120){
      keys.sort(function(a,b){return (c[b].ts||0)-(c[a].ts||0);});
      var trimmed={};
      keys.slice(0,120).forEach(function(k){trimmed[k]=c[k];});
      S._enrichCache=c=trimmed;
    }
    localStorage.setItem("edge_enrich",JSON.stringify(c));
  }catch(e){}
}
function enrichQueue(list, done){
  var i=0, any=false;
  function step(){
    if(i>=list.length){
      if(any){try{saveEnrichCache();}catch(e){}}
      if(done)done(any);
      return;
    }
    var m=list[i++];
    var key="enrich_"+m.homeId+"_"+m.awayId;
    var cached=S._enrichCache&&S._enrichCache[key];
    if(cached&&Date.now()-cached.ts<12*3600000){
      try{applyEnrich(m,cached.data);any=true;}catch(e){}
      return step();
    }
    var url="/api/enrich?homeId="+m.homeId+"&awayId="+m.awayId+(m.id?"&fixtureId="+m.id:"")+(m.leagueId?"&leagueId="+m.leagueId:"");
    var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    var to=setTimeout(function(){try{ctrl&&ctrl.abort();}catch(e){}}, 9000);
    fetch(url, ctrl?{signal:ctrl.signal}:undefined)
      .then(function(r){return r.json();})
      .then(function(data){
        clearTimeout(to);
        if(data&&!data.error){
          if(!S._enrichCache)S._enrichCache={};
          S._enrichCache[key]={data:data,ts:Date.now()};
          try{applyEnrich(m,data);any=true;}catch(e){}
        }
      })
      .catch(function(){clearTimeout(to);})
      .then(function(){ setTimeout(step, 260); });
  }
  step();
}
function enrichTopMatches(){
  if(S._enriching)return;
  var cands=(S.matches||[]).filter(function(m){
    return m.hasRealOdds && m.homeId && m.awayId && !m._enriched
      && !isDone(m.time||m.t) && !isLive(m.time||m.t,m.status);
  });
  // Les plus proches d'abord : ce sont les seuls sur lesquels on peut agir
  cands.sort(function(a,b){return new Date(a.time||a.t)-new Date(b.time||b.t);});
  cands=cands.slice(0,10);
  if(!cands.length)return;
  S._enriching=true;
  S._enrichTotal=cands.length;
  S._enrichDone=0;
  enrichQueue(cands, function(any){
    S._enriching=false;
    S._enrichTotal=0;
    // Les signaux et le track record se basent maintenant sur des données réelles
    if(any){
      try{recordSignals();}catch(e){}
      try{checkNewSignals();}catch(e){}
      try{renderPage();}catch(e){}
    }
  });
}

// ═══ MEILLEUR PARI — tous marchés confondus ═══
// Validé par simulation : 61,5% de réussite contre 52,3% en 1X2 seul.
function bestBets(m, r){
  if(!m||!r) return [];
  var H=(m.h||m.home||"Domicile"), A=(m.a||m.away||"Extérieur");
  var cands=[
    {k:"1",   l:"Victoire "+H,        p:r.pH,          o:m.o1,      cat:"1X2"},
    {k:"N",   l:"Match nul",          p:r.pN,          o:m.on||m.oN,cat:"1X2"},
    {k:"2",   l:"Victoire "+A,        p:r.pA,          o:m.o2,      cat:"1X2"},
    {k:"1X",  l:H+" ou nul",          p:r.p1X,         o:m.dc1x,    cat:"Double chance"},
    {k:"X2",  l:A+" ou nul",          p:r.p2X,         o:m.dcx2,    cat:"Double chance"},
    {k:"12",  l:"Pas de nul",         p:(r.pH||0)+(r.pA||0), o:m.dc12, cat:"Double chance"},
    {k:"O15", l:"Plus de 1,5 but",    p:(r.pUnder15!==undefined?1-r.pUnder15:undefined), o:m.over15, cat:"Buts"},
    {k:"O25", l:"Plus de 2,5 buts",   p:r.pOver25,     o:m.over25,  cat:"Buts"},
    {k:"U25", l:"Moins de 2,5 buts",  p:r.pUnder25,    o:m.under25, cat:"Buts"},
    {k:"O35", l:"Plus de 3,5 buts",   p:r.pOver35,     o:m.over35,  cat:"Buts"},
    {k:"BY",  l:"Les 2 équipes marquent",     p:r.pBttsY, o:m.bttsY, cat:"BTTS"},
    {k:"BN",  l:"Une équipe ne marque pas",   p:r.pBttsN, o:m.bttsN, cat:"BTTS"}
  ];
  // ── ANCRAGE MARCHÉ SUR LES MARCHÉS ALTERNATIFS ──
  // Mesuré : sans cela, le moteur annonçait 80% sur "Plus de 1,5 but"
  // alors que ça n'arrivait que 68% du temps. Le prix du bookmaker
  // reste le meilleur estimateur, ici comme sur le 1X2.
  var PAIRS={O25:"U25",U25:"O25",BY:"BN",BN:"BY"};
  var oddOf={};
  cands.forEach(function(c){ oddOf[c.k]=c.o; });
  function marketProb(c){
    if(!c.o||c.o<1.01) return null;
    var opp=PAIRS[c.k]?oddOf[PAIRS[c.k]]:null;
    if(opp&&opp>1.01){
      // Marché à deux issues : dé-vig exact
      var a=1/c.o, b=1/opp;
      return a/(a+b);
    }
    // Sinon on retire une marge typique de 4,5%
    var p=(1/c.o)/1.045;
    return (p>0&&p<1)?p:null;
  }
  var out=[];
  cands.forEach(function(c){
    if(c.p===undefined||c.p===null||!isFinite(c.p))return;
    if(!c.o||!isFinite(c.o)||c.o<1.30)return;   // cote trop basse = sans intérêt
    var pFinal=c.p;
    if(c.cat!=="1X2"){
      var pm=marketProb(c);
      if(pm!==null&&isFinite(pm)){
        // 85% marché / 15% modèle, comme sur le 1X2
        pFinal=0.85*pm+0.15*c.p;
      }
    }
    if(!isFinite(pFinal)||pFinal<0.45)return;   // on ne propose pas un pari minoritaire
    out.push({k:c.k,label:c.l,prob:pFinal,odd:+c.o,ev:+(pFinal*c.o-1).toFixed(4),cat:c.cat});
  });
  out.sort(function(a,b){return b.prob-a.prob;});
  return out;
}

function runVerif(){
  S.verifLoad=true;S.verifErr=null;renderPage();
  fetch("/api/backtest?days=10").then(function(r){return r.json();}).then(function(d){
    S.verifLoad=false;
    var ms=(d&&d.matches)||[];
    if(!ms.length){S.verifErr="Aucun match terminé avec cotes disponible pour la vérification.";renderPage();return;}
    var n=0,w=0,sumP=0;
    ms.forEach(function(m){
      var r;try{r=calc(m);}catch(e){return;}
      if(!r)return;
      var bb;try{bb=bestBets(m,r);}catch(e){return;}
      if(!bb||!bb.length)return;
      var b=bb[0], tot=m.totalGoals, bt=!!m.btts, res=m.realResult;
      var won;
      switch(b.k){
        case "1":won=res==="1";break; case "N":won=res==="N";break; case "2":won=res==="2";break;
        case "1X":won=res!=="2";break; case "X2":won=res!=="1";break; case "12":won=res!=="N";break;
        case "O15":won=tot>1.5;break; case "O25":won=tot>2.5;break; case "U25":won=tot<2.5;break;
        case "O35":won=tot>3.5;break; case "BY":won=bt;break; case "BN":won=!bt;break;
        default:won=false;
      }
      n++;sumP+=b.prob;if(won)w++;
    });
    if(!n){S.verifErr="Pas assez de données exploitables.";renderPage();return;}
    S.verif={n:n,days:d.daysAnalysed||10,acc:w/n*100,calib:(w/n*100)-(sumP/n*100)};
    renderPage();
  }).catch(function(e){
    S.verifLoad=false;S.verifErr="Connexion impossible.";renderPage();
  });
}

function runAudit(){
  var el=document.getElementById("audit-in");
  var raw=el&&el.value?el.value:"";
  S.auditRaw=raw; S.auditErr=null; S.auditRes=null;
  var lines=raw.split(/[\n;]+/).map(function(x){return x.trim();}).filter(Boolean);
  var bets=[];
  lines.forEach(function(l){
    var mm=l.replace(",",".").match(/(\d+[.,]?\d*)\s*[^\dA-Za-z]*\s*([GgWwPpLl10])\s*(\d+[.,]?\d*)?/);
    if(!mm)return;
    var cote=parseFloat(mm[1]);
    if(!isFinite(cote)||cote<1.01||cote>100)return;
    var mk=(mm[2]||"").toUpperCase();
    var won=(mk==="G"||mk==="W"||mk==="1");
    var mise=mm[3]?parseFloat(mm[3].replace(",",".")):1;
    if(!isFinite(mise)||mise<=0)mise=1;
    bets.push({cote:cote,won:won,mise:mise});
  });
  if(bets.length<5){S.auditErr="Il me faut au moins 5 paris lisibles. Vérifie le format : une cote, puis G ou P.";renderPage();return;}

  var n=bets.length;
  var wins=bets.filter(function(b){return b.won;}).length;
  var totalMise=bets.reduce(function(s,b){return s+b.mise;},0);
  var pnl=bets.reduce(function(s,b){return s+(b.won?b.mise*(b.cote-1):-b.mise);},0);
  var roi=totalMise>0?pnl/totalMise*100:0;
  var winRate=wins/n*100;
  var avgOdd=bets.reduce(function(s,b){return s+b.cote;},0)/n;
  var attendu=bets.reduce(function(s,b){return s+1/b.cote;},0)/n*100;  // réussite attendue si cotes justes

  var mises=bets.map(function(b){return b.mise;});
  var mMoy=mises.reduce(function(a,b){return a+b;},0)/n;
  var ecart=Math.sqrt(mises.reduce(function(a,b){return a+Math.pow(b-mMoy,2);},0)/n);
  var cv=mMoy>0?ecart/mMoy:0;
  var maxMise=Math.max.apply(null,mises);

  var favoris=bets.filter(function(b){return b.cote<1.60;}).length/n*100;
  var grosses=bets.filter(function(b){return b.cote>4.00;}).length/n*100;

  var pts=[];
  // Discipline de mise — le facteur n°1 de ruine
  if(cv>0.55){
    pts.push({type:"bad",title:"Tes mises sont trop irrégulières",text:"Ta plus grosse mise fait <strong>"+(maxMise/mMoy).toFixed(1)+"× ta mise moyenne</strong>. C\'est la première cause de ruine : un seul pari émotionnel efface vingt paris disciplinés. La méthode Kelly fixe la mise selon l\'avantage réel, jamais selon la confiance ressentie."});
  } else if(cv<0.20){
    pts.push({type:"good",title:"Mises régulières",text:"Ton écart de mise est faible : tu ne te laisses pas emporter. C\'est la qualité la plus rare chez les parieurs, et la plus rentable sur la durée."});
  }
  // Biais favoris
  if(favoris>50){
    pts.push({type:"bad",title:"Tu joues surtout des favoris",text:Math.round(favoris)+"% de tes paris sont à moins de 1,60. Ces cotes sont les plus travaillées par les bookmakers et contiennent le moins de valeur. Le gain y est faible, la perte totale."});
  }
  if(grosses>30){
    pts.push({type:"bad",title:"Trop de grosses cotes",text:Math.round(grosses)+"% de tes paris dépassent 4,00. La variance y est brutale : tu peux enchaîner quinze pertes sans que rien ne soit anormal. Ton capital doit être dimensionné pour ça."});
  }
  // Écart réussite / attendu
  var diff=winRate-attendu;
  if(diff>4){
    pts.push({type:"good",title:"Tu bats la probabilité implicite",text:"Tes paris réussissent à <strong>"+winRate.toFixed(0)+"%</strong> alors que les cotes n\'en annonçaient que "+attendu.toFixed(0)+"%. Sur un petit échantillon ça peut être de la chance — mais si ça tient sur 200 paris, tu as un vrai avantage."});
  } else if(diff<-6){
    pts.push({type:"bad",title:"Sous la probabilité implicite",text:"Tu réussis "+winRate.toFixed(0)+"% là où les cotes annonçaient "+attendu.toFixed(0)+"%. Tu perds plus que la seule marge du bookmaker : le problème vient de la sélection, pas de la malchance."});
  }
  // Volume
  if(n<20){
    pts.push({type:"info",title:"Échantillon encore court",text:"Avec "+n+" paris, la chance domine encore largement. Il faut environ 200 paris pour distinguer un avantage réel d\'une bonne série."});
  }
  // Marge
  pts.push({type:"info",title:"La marge que tu paies",text:"À cote moyenne "+avgOdd.toFixed(2)+", les bookmakers prélèvent environ 5%. Chaque point gagné sur le <strong>prix</strong> — en comparant les bookmakers — se transforme directement en ROI, sans avoir à mieux prédire."});

  var verdict;
  if(roi>5&&n>=30) verdict="Profil <strong style=\"color:var(--vert)\">solide</strong> sur cet échantillon. Ton enjeu maintenant : tenir la discipline quand arrivera la mauvaise série — et elle arrivera.";
  else if(roi>0) verdict="Tu es <strong style=\"color:var(--vert)\">à l\'équilibre positif</strong>. Sur un échantillon aussi court, c\'est encourageant sans être une preuve. Continue à mesurer.";
  else if(roi>-10) verdict="Tu perds à peu près <strong>la marge du bookmaker</strong> — c\'est le résultat normal d\'un parieur qui joue sans avantage. La bonne nouvelle : c\'est récupérable en travaillant le prix et la mise.";
  else verdict="Tu perds <strong style=\"color:var(--rouge)\">nettement plus que la marge</strong>. Ce n\'est pas de la malchance : il y a un problème de sélection ou de gestion de mise. Les points ci-dessous te disent lequel.";

  S.auditRes={n:n,roi:roi,winRate:winRate,avgOdd:avgOdd,attendu:attendu,points:pts,verdict:verdict};
  renderPage();
}

// ═══ SUIVI DES MOUVEMENTS DE COTES ═══
// Quand une cote bouge, c'est de l'argent informé qui entre.
// On enregistre chaque relevé et on mesure la dérive en POINTS DE PROBABILITÉ.
function loadOddsHist(){
  try{
    var raw=localStorage.getItem("edge_odds_hist");
    if(!raw){S._oh={};return;}
    var o=JSON.parse(raw), now=Date.now(), keep={};
    Object.keys(o).forEach(function(k){
      var arr=(o[k]||[]).filter(function(x){return now-x.t<4*86400000;});
      if(arr.length) keep[k]=arr;
    });
    S._oh=keep;
  }catch(e){S._oh={};}
}
function saveOddsHist(){
  try{
    var o=S._oh||{}, keys=Object.keys(o);
    if(keys.length>250){
      keys.sort(function(a,b){return (o[b][o[b].length-1].t||0)-(o[a][o[a].length-1].t||0);});
      var t={}; keys.slice(0,250).forEach(function(k){t[k]=o[k];});
      S._oh=o=t;
    }
    localStorage.setItem("edge_odds_hist",JSON.stringify(o));
  }catch(e){}
}
function impliedProbs(o1,on,o2){
  if(!o1||!on||!o2)return null;
  var s=1/o1+1/on+1/o2;
  return {p1:(1/o1)/s, pn:(1/on)/s, p2:(1/o2)/s};
}
function recordOddsSnapshot(){
  if(!S._oh)loadOddsHist();
  var now=Date.now(), changed=false;
  (S.matches||[]).forEach(function(m){
    if(!m.id||!m.hasRealOdds||!m.o1)return;
    if(isDone(m.time||m.t))return;
    var k=String(m.id);
    if(!S._oh[k])S._oh[k]=[];
    var arr=S._oh[k], last=arr[arr.length-1];
    if(last && last.o1===m.o1 && last.on===m.on && last.o2===m.o2){
      last.t=now; changed=true; return;             // pas de changement : on rafraîchit l'horodatage
    }
    arr.push({t:now,o1:m.o1,on:m.on,o2:m.o2});
    if(arr.length>40) arr.splice(0,arr.length-40);
    changed=true;
  });
  if(changed)saveOddsHist();
}
// Métriques de mouvement pour un match
function oddsMovement(m){
  if(!m||!m.id||!S._oh)return null;
  var arr=S._oh[String(m.id)];
  if(!arr||arr.length<2)return null;
  var first=arr[0], last=arr[arr.length-1];
  var pf=impliedProbs(first.o1,first.on,first.o2);
  var pl=impliedProbs(last.o1,last.on,last.o2);
  if(!pf||!pl)return null;
  var d1=(pl.p1-pf.p1)*100, dn=(pl.pn-pf.pn)*100, d2=(pl.p2-pf.p2)*100;
  var best={k:"1",d:d1}; if(Math.abs(dn)>Math.abs(best.d))best={k:"N",d:dn};
  if(Math.abs(d2)>Math.abs(best.d))best={k:"2",d:d2};
  var hours=Math.max(0.25,(last.t-first.t)/3600000);
  // Mouvement violent : forte dérive sur une courte période
  var recent=arr.filter(function(x){return last.t-x.t<=3*3600000;});
  var steam=null;
  if(recent.length>=2){
    var rf=impliedProbs(recent[0].o1,recent[0].on,recent[0].o2);
    if(rf){
      var r1=(pl.p1-rf.p1)*100, rn=(pl.pn-rf.pn)*100, r2=(pl.p2-rf.p2)*100;
      var rb={k:"1",d:r1}; if(Math.abs(rn)>Math.abs(rb.d))rb={k:"N",d:rn};
      if(Math.abs(r2)>Math.abs(rb.d))rb={k:"2",d:r2};
      if(Math.abs(rb.d)>=3) steam={pick:rb.k,delta:Math.round(rb.d*10)/10};
    }
  }
  return {
    n:arr.length, hours:Math.round(hours*10)/10,
    pick:best.k, delta:Math.round(best.d*10)/10,
    d1:Math.round(d1*10)/10, dn:Math.round(dn*10)/10, d2:Math.round(d2*10)/10,
    openO:{o1:first.o1,on:first.on,o2:first.o2},
    nowO:{o1:last.o1,on:last.on,o2:last.o2},
    steam:steam,
    significant:Math.abs(best.d)>=2,
    series:arr
  };
}
// Courbe SVG du mouvement d'une issue
function movSpark(arr, key, w, hgt){
  w=w||220; hgt=hgt||42;
  var pts=arr.map(function(x){
    var p=impliedProbs(x.o1,x.on,x.o2);
    return p?({"1":p.p1,"N":p.pn,"2":p.p2}[key]):null;
  }).filter(function(v){return v!==null;});
  if(pts.length<2)return "";
  var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts);
  var span=Math.max(0.012,mx-mn);
  var coords=pts.map(function(v,i){
    var x=(i/(pts.length-1))*w;
    var y=hgt-((v-mn)/span)*(hgt-6)-3;
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  var up=pts[pts.length-1]>pts[0];
  var col=up?"var(--vert)":"var(--rouge)";
  var s='<svg viewBox="0 0 '+w+' '+hgt+'" width="100%" height="'+hgt+'" preserveAspectRatio="none" style="display:block">';
  s+='<polyline points="'+coords+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
  var lastPt=coords.split(" ").pop().split(",");
  s+='<circle cx="'+lastPt[0]+'" cy="'+lastPt[1]+'" r="3" fill="'+col+'"/>';
  s+='</svg>';
  return s;
}
// Alerte sur mouvement violent
function checkSteamMoves(){
  if(!S.notifOn)return;
  var seen;
  try{seen=JSON.parse(localStorage.getItem("edge_steam")||"[]");}catch(e){seen=[];}
  var changed=false;
  (S.matches||[]).forEach(function(m){
    if(!m.hasRealOdds||isDone(m.time||m.t)||isLive(m.time||m.t,m.status))return;
    var mv=oddsMovement(m);
    if(!mv||!mv.steam)return;
    var key=m.id+"_"+mv.steam.pick;
    if(seen.indexOf(key)>=0)return;
    var lbl=mv.steam.pick==="1"?(m.h||m.home):mv.steam.pick==="2"?(m.a||m.away):"Match nul";
    var sens=mv.steam.delta>0?"se raccourcit":"s'allonge";
    if(sendNotif("⚡ Mouvement de cote détecté",
      (m.h||m.home)+" vs "+(m.a||m.away)+"\n→ "+lbl+" "+sens+" de "+Math.abs(mv.steam.delta)+" points en moins de 3h",
      "steam-"+m.id)){
      seen.push(key); changed=true;
    }
  });
  if(changed){try{localStorage.setItem("edge_steam",JSON.stringify(seen.slice(-150)));}catch(e){}}
}
// ═══ CLV — bats-tu la cote de clôture ? ═══
function updateCLV(){
  if(!S.track||!S._oh)return;
  var changed=false;
  S.track.forEach(function(t){
    if(t.clv!==undefined&&t.clv!==null)return;
    var arr=S._oh[String(t.id)];
    if(!arr||arr.length<2)return;
    var closing=arr[arr.length-1];
    var co={"1":closing.o1,"N":closing.on,"2":closing.o2}[t.pick];
    if(!co||!t.cote)return;
    // Sur les marchés hors 1X2, la cote de clôture n'est pas comparable
    if(["1","N","2"].indexOf(t.pick)<0)return;
    t.closeOdd=co;
    // CLV standard : prendre 2,10 sur un match qui clôture à 1,85 = +13,5%
    t.clv=Math.round((t.cote/co-1)*1000)/10;
    changed=true;
  });
  if(changed)saveTrack();
}
function clvStats(){
  var arr=(S.track||[]).filter(function(t){return typeof t.clv==="number"&&isFinite(t.clv);});
  if(!arr.length)return null;
  var beat=arr.filter(function(t){return t.clv>0;}).length;
  var avg=arr.reduce(function(s,t){return s+t.clv;},0)/arr.length;
  return {n:arr.length,beatRate:Math.round(beat/arr.length*100),avg:Math.round(avg*10)/10};
}

// ═══ NIVEAU D'ANALYSE — un seul indicateur clair par match ═══
// Dit franchement ce qu'EDGE peut apporter, et ce qui manque.
function analysisLevel(m){
  if(!m) return null;
  var has={
    odds:   !!m.hasRealOdds,
    books:  (m.nBooks||0)>=3,
    stats:  !!m._enriched,
    mov:    false,
    price:  !!(m.lineValue&&m.lineValue.edge>=0.03)
  };
  try{ var mv=oddsMovement(m); has.mov=!!(mv&&mv.n>=3); }catch(e){}

  var lvl=0, missing=[];
  if(!has.odds){
    return {level:0,label:"Non analysable",short:"—",color:"var(--w30)",
      desc:"Les bookmakers n'ont pas publié les cotes.",
      missing:["Cotes du marché"],has:has};
  }
  lvl=1;
  if(has.stats) lvl=2; else missing.push("Statistiques des équipes");
  if(has.mov)   lvl=3; else missing.push("Historique des cotes");
  if(has.books&&has.mov&&has.stats) lvl=4;
  if(!has.books) missing.push("Comparaison multi-bookmakers");

  var L={
    1:{label:"Cotes seules",short:"Basique",color:"var(--w30)",
       desc:"Probabilités issues du marché. Aucun avantage détectable à ce stade."},
    2:{label:"Statistiques réelles",short:"Enrichi",color:"var(--bl2)",
       desc:"xG, forme et confrontations chargés. Probabilités affinées."},
    3:{label:"Marché suivi",short:"Suivi",color:"var(--acc)",
       desc:"Mouvements de cotes tracés. On voit où va l'argent informé."},
    4:{label:"Analyse complète",short:"Complet",color:"var(--vert)",
       desc:"Stats réelles, mouvements suivis et prix comparés. C'est ici qu'EDGE est le plus utile."}
  }[lvl];
  return {level:lvl,label:L.label,short:L.short,color:L.color,desc:L.desc,missing:missing,has:has};
}
// Jauge visuelle : 4 barres
function levelBars(lv,size){
  if(!lv) return "";
  var w=size||4, out='<span style="display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle">';
  for(var i=1;i<=4;i++){
    var on=i<=lv.level;
    out+='<span style="width:'+w+'px;height:'+(4+i*2)+'px;border-radius:1px;background:'+(on?lv.color:'var(--w12)')+'"></span>';
  }
  return out+'</span>';
}

// ═══ CE QUE LE MEILLEUR PRIX RAPPORTE, EN EUROS ═══
// Pour chaque signal enregistré, on garde la cote de référence ET la meilleure.
// À l'arrivée on chiffre la différence : c'est la valeur concrète de l'abonnement.
function euroGains(mise){
  mise = mise || S.gainMise || 10;
  var tk = S.track || [];
  var withPrice = tk.filter(function(t){return t.refOdd && t.cote && t.cote > t.refOdd;});
  var settled = withPrice.filter(function(t){return t.status==="won"||t.status==="lost";});
  var won = settled.filter(function(t){return t.status==="won";});
  // Gain supplémentaire = (meilleure cote − cote de référence) × mise, sur les paris gagnés
  var extra = 0;
  won.forEach(function(t){ extra += (t.cote - t.refOdd) * mise; });
  // Ce qu'auraient rapporté les mêmes paris à la cote de référence
  var refPnl = 0, bestPnl = 0;
  settled.forEach(function(t){
    if(t.status==="won"){ refPnl += (t.refOdd-1)*mise; bestPnl += (t.cote-1)*mise; }
    else { refPnl -= mise; bestPnl -= mise; }
  });
  var totalMise = settled.length * mise;
  return {
    n: withPrice.length,
    settled: settled.length,
    won: won.length,
    mise: mise,
    extra: Math.round(extra*100)/100,
    refPnl: Math.round(refPnl*100)/100,
    bestPnl: Math.round(bestPnl*100)/100,
    refRoi: totalMise>0 ? Math.round(refPnl/totalMise*1000)/10 : 0,
    bestRoi: totalMise>0 ? Math.round(bestPnl/totalMise*1000)/10 : 0,
    pending: withPrice.filter(function(t){return t.status==="pending";}).length,
    avgGapPct: withPrice.length ? Math.round(withPrice.reduce(function(s,t){return s+(t.cote/t.refOdd-1);},0)/withPrice.length*1000)/10 : 0
  };
}
